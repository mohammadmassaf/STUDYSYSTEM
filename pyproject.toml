[project]
name = "studysystem"
version = "0.1.0"
description = "An MCP server that plans and tracks a student's semester: courses, past exams, topics, a ranked study plan, logged hours."
readme = "README.md"
authors = [
    { name = "mohammadmassaf", email = "mahdiassaf998@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "click>=8.5.0",
    "mcp>=2,<3",
    "platformdirs>=4.11.9",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
study = "studysystem.cli:study"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
