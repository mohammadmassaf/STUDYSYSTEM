name: publish

# A version tag builds the package once and uploads that same build: to TestPyPI, then - for a
# final version, after Mohammad approves - to PyPI (D-323, D-334). Trusted publishing: each index
# trusts this file in this repo, so no password or token is stored anywhere.
#
# Every action is named by its commit: a tag such as v5 can be moved to other code.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the whole history: is the tag on main?
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          enable-cache: false
      # The tag is the release truth (D-334): v1.0.0rc1 builds 1.0.0rc1. The change stays in this
      # runner; pyproject.toml in the repo keeps its own number. uv refuses a tag that is not a
      # valid version, which stops the run here. Only X.Y.Z is final: 1.0.0-rc.1 and 1.0.0pre1 are
      # valid too, and must not reach PyPI. A final tag must be on main (D-359).
      - name: version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv version --frozen "$version"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git merge-base --is-ancestor HEAD origin/main
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  # An upload to an index can never be replaced, so the wheel must start first. A job of its own:
  # it runs the newest packages we depend on, and none of them may touch the files we upload.
  starts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv run --isolated --no-project --with dist/*.whl study --help

  testpypi:
    needs: [build, starts]
    runs-on: ubuntu-latest
    # The environment name is part of what TestPyPI's trusted publisher checks.
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    needs: [build, starts, testpypi]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    # The pypi environment requires Mohammad's approval in GitHub's settings: this job waits for
    # his click in the Actions tab (D-323's "waits for his go").
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
          enable-cache: false
      - run: uv publish --trusted-publishing always
