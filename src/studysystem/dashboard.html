const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'Date unknown';
let raw,plan=[],courses=[],meetings=[],store=(()=>{try{let v=JSON.parse(localStorage.getItem('semcon.state.v2')||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}})(),timer=null,session=null,startError=null;
function saveStore(){try{localStorage.setItem('semcon.state.v2',JSON.stringify(store))}catch(e){}}
function adapt(s){raw=s;courses=(s.courses||[]).map(c=>({...c,code:c.code||null}));meetings=s.timetable?.meetings||[];plan=[];const p=s.plan?.current?.lanes;if(p){for(const lane of ['review','study','setup']){const l=p[lane];if(!l)continue;const covered=new Set((l.entries||[]).flatMap(e=>e.topic_ids||[]));for(const i of (l.items||[])){if(covered.has(i.topic_id))continue;plan.push({uid:lane+':'+(i.setup_key||i.topic_id||i.rank),lane,rank:i.rank,course:courses.find(c=>c.course_id===i.course_id)||null,what:lane==='setup'?i.reason:(i.topic_name||i.reason||'Study item'),why:i.reason||null,mins:i.estimated_minutes??null,setupKey:i.setup_key||null,topicId:i.topic_id||null,materialId:i.material_id||null});}for(const e of (l.entries||[])){const ids=e.topic_ids||[];plan.push({uid:lane+':'+(e.material_id||ids[0]||e.rank),lane,rank:e.rank,course:courses.find(c=>c.course_id===e.course_id)||null,what:[e.chapter,...(e.topics||[])].filter(Boolean).join(': '),why:(l.items||[]).filter(i=>ids.includes(i.topic_id)).map(i=>i.reason).filter(Boolean).join(' · ')||null,mins:e.estimated_minutes??null,topicId:ids[0]||null,materialId:e.material_id||null});}}}
let today=new Date().toISOString().slice(0,10);if(store.day!==today){store.day=today;store.items={};}if(!store.items||typeof store.items!=='object'||Array.isArray(store.items))store.items={};store.custom=Array.isArray(store.custom)?store.custom:[];saveStore();}
function status(it){return it.uid.startsWith('custom:')?(store.custom.find(x=>x.id===it.id)?.done?'done':'upcoming'):(store.items?.[it.uid]?.status||'upcoming')}
function allItems(){const custom=store.custom.filter(x=>!x.done).map(x=>({uid:'custom:'+x.id,id:x.id,custom:true,what:x.title,lane:'custom',mins:x.mins,course:courses.find(c=>c.code===x.course)||null,why:'Personal task'}));return custom.concat(plan.filter(x=>status(x)!=='skipped'));}
function focus(){return allItems().find(x=>status(x)==='upcoming'&&x.lane!=='setup')||null}
const mins=x=>x?.mins==null?'Time unknown':x.mins+' min';
function themeNow(){let t=document.documentElement.dataset.theme;return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}

try{let t=localStorage.getItem('semcon.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
function nav(){let pages=[['today','Today'],['plan','Plan'],['schedule','Schedule'],['courses','Courses']];$('#nav').innerHTML=pages.map(([k,n])=>`<a href="#/${k}" class="${page()===k?'on':''}">${n}</a>`).join('')+`<div class="theme-switch" role="group" aria-label="Color theme"><button type="button" data-act="theme" data-id="light" aria-pressed="${themeNow()==='light'}" title="Light theme" aria-label="Light theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-act="theme" data-id="dark" aria-pressed="${themeNow()==='dark'}" title="Dark theme" aria-label="Dark theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div>`}
function page(){let p=location.hash.replace('#/','').split(/[/?]/)[0];return ['today','plan','schedule','courses'].includes(p)?p:'today'}
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)}),v=await r.json();if(!r.ok)throw v;return v}

function row(it,index){let c=it.course;return `<article class="entry ${index===0?'focus':''}"><span class="time">${index===0?'Next':String(index+1).padStart(2,'0')}</span><div class="entrybox"><span class="eyebrow">${esc(it.lane[0].toUpperCase()+it.lane.slice(1))}${c?' · '+esc(c.code):''} · ${esc(mins(it))}</span><h3>${esc(it.what)}</h3><p>${esc(it.why||'Ranked in the current plan')}</p>${actionButtons(it)}</div></article>`}
function classRows(){let wd=(new Date().getDay()+6)%7,classes=meetings.filter(m=>((m.weekday??m.day_of_week??m.day??0)+6)%7===wd).map(m=>({time:m.start||m.start_time||'',end:m.end||m.end_time||'',course:courses.find(c=>c.course_id===m.course_id),what:m.code||courses.find(c=>c.course_id===m.course_id)?.name||'Class',name:courses.find(c=>c.course_id===m.course_id)?.name||null,meta:m.room||'Room unknown'})).sort((a,b)=>a.time.localeCompare(b.time));return classes.length?classes.map(x=>`<div class="agenda-row class"><time>${esc(x.time)}${x.end?`<small>${esc(x.end)}</small>`:''}</time><div><span class="eyebrow">Class${x.course?' · '+esc(x.course.code):''}</span><b>${esc(x.what)}${x.name&&x.name!==x.what?` <span class="cls-name">${esc(x.name)}</span>`:''}</b><small>${esc(x.meta)}</small></div></div>`).join(''):'<p class="empty">No classes today.</p>'}

const LANES=[['setup','Setup'],['study','Study'],['review','Review'],['custom','Personal']];
function laneHidden(l){return raw.plan?.current?.lanes?.[l]?.hidden||0}
function taskList(){let open=allItems().filter(x=>status(x)==='upcoming'),n=open.length,col=collapsed(),chev=n>1?`<button class="chev" data-act="toggle" aria-expanded="${!col}" aria-controls="taskbody"><span>${col?`Show all ${n}`:'Collapse'}</span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`:'',head=`<div class="tasks-head"><div class="eyebrow">Today’s tasks · ${n} open</div>${chev}</div>`;if(!n)return head+'<p class="empty">No open tasks. Add a personal task below.</p>';return head+`<div class="timeline" id="taskbody">${(col?open.slice(0,1):open).map((it,i)=>row(it,i)).join('')}</div>${col&&n>1?`<p class="more">+${n-1} more ${n-1===1?'task':'tasks'} · press the arrow to show them</p>`:''}`}
function today(){return `<div class="day-layout"><section><div class="eyebrow">Today’s classes</div><div class="agenda">${classRows()}</div>${taskList()}</section>${focusPanel()}</div>${metrics()}${taskForm()}`}
function taskForm(){return `<form class="form" id="add"><input name="title" required maxlength="120" placeholder="Add a personal task"><select name="course"><option value="">No course</option>${courses.map(c=>`<option>${esc(c.code)}</option>`).join('')}</select><select name="mins">${[15,25,30,45,60,90].map(n=>`<option value="${n}" ${n===30?'selected':''}>${n} min</option>`).join('')}</select><button class="btn primary">Add task</button></form>`}
const COLORS=['#4cc9f0','#f7b267','#c7a4ff','#ff8fab','#8ecae6','#ffd166','#b8c0ff','#ff9e7a','#a0e7e5'];
const ccolor=c=>COLORS[Math.max(0,courses.indexOf(c))%COLORS.length];
const LANE_INFO={setup:['Setup','Get material in: past papers and chapters the plan still needs.','var(--lime)'],study:['Study','Topics to learn, ranked by exam stakes and effort.','var(--green)'],review:['Review','Revision of topics you already studied.','var(--violet)']};
function planPage(){const created=raw.plan?.current?.created_at,cf=new URLSearchParams(location.hash.split('?')[1]||'').get('course')||'all',t0=new Date().toISOString().slice(0,10),examOf=c=>c?(raw.assessment_slots||[]).filter(a=>a.course_id===c.course_id&&a.date&&a.date>=t0).sort((a,b)=>a.date.localeCompare(b.date))[0]:null,lane=k=>{let [label,desc,lc]=LANE_INFO[k],xs=plan.filter(x=>x.lane===k),h=laneHidden(k),ids=[...new Set(xs.map(x=>x.course?.course_id||''))],groups=ids.map(id=>{let its=xs.filter(x=>(x.course?.course_id||'')===id),c=its[0].course,ex=examOf(c),d=ex?daysTo(ex.date):null;return `<article class="cgroup" data-course="${esc(id)}" style="--cc:${c?ccolor(c):'#777'}" ${cf!=='all'&&id!==cf?'hidden':''}><header><b>${esc(c?.code||'Personal')}</b><span class="chip">${its.length} ${its.length===1?'task':'tasks'}</span>${ex?`<span class="chip">${esc(ex.name)} · ${fmt(ex.date)}${d!=null?' · '+d+'d':''}${ex.weight!=null?' · '+ex.weight+'%':''}</span>`:''}<span class="cname">${esc(c?.name||'')}</span></header><ol class="tasklist">${its.map(it=>`<li class="pitem ${esc(status(it))}"><span class="rank">#${it.rank||'–'}</span><div class="pbody"><b>${esc(it.what)}</b><div class="pmeta"><span>${esc(mins(it))}</span></div>${it.why?`<details><summary>Why ranked</summary><p>${esc(it.why)}</p></details>`:''}</div><span class="mark">${esc(status(it))}</span></li>`).join('')}</ol></article>`}).join('');return `<section class="plan-lane" style="--lc:${lc}"><header class="lane-head"><div><h2>${label}</h2><p>${desc}</p></div><div class="lane-count"><b>${xs.length}</b> shown${h?`<small>+${h} not shown by the server</small>`:''}</div></header>${xs.length?`<div class="cgroups">${groups}</div>`:'<p class="empty pad">Nothing in this lane right now.</p>'}</section>`};return `<div class="plan-head"><div><div class="eyebrow">All ranked work · refreshed ${created?fmt(created.slice(0,10)):'date unknown'}</div><p class="subtle">Priority, assessment stakes and effort across every course.</p></div><label class="filter">Course <select onchange="filterPlan(this.value)"><option value="all">All courses</option>${courses.map(c=>`<option value="${esc(c.course_id)}" ${c.course_id===cf?'selected':''}>${esc(c.code)} · ${esc(c.name)}</option>`).join('')}</select></label></div><div class="course-progress">${courses.map(c=>{let xs=plan.filter(x=>x.course?.course_id===c.course_id),done=xs.filter(x=>status(x)==='done').length;return `<div class="progress-card"><b>${esc(c.code)}</b><span>${done} / ${xs.length} ranked done</span><i><em style="width:${xs.length?done/xs.length*100:0}%"></em></i></div>`}).join('')}</div>${['setup','study','review'].map(lane).join('')}${taskForm()}`}
function filterPlan(id){document.querySelectorAll('.cgroup').forEach(r=>r.hidden=id!=='all'&&r.dataset.course!==id)}
function schedule(){if(!meetings.length)return `<p class="empty">Timetable has no meetings entered.</p>`;const days=['Monday','Tuesday','Wednesday','Thursday','Friday'],dayIdx=m=>((m.weekday??m.day_of_week??m.day??0)+6)%7,toMin=t=>{let [h,m]=String(t||'').split(':').map(Number);return (h||0)*60+(m||0)},startOf=m=>m.start||m.start_time,endOf=m=>m.end||m.end_time,usable=meetings.filter(m=>startOf(m)&&endOf(m)&&dayIdx(m)<5);if(!usable.length)return `<p class="empty">Meeting times are not available.</p>`;let first=Math.min(...usable.map(m=>toMin(startOf(m)))),last=Math.max(...usable.map(m=>toMin(endOf(m)))),base=Math.floor(first/60)*60,hrs=Math.max(4,Math.ceil(last/60)-base/60),px=58,today=(new Date().getDay()+6)%7,now=new Date().getHours()*60+new Date().getMinutes(),colors=['#4cc9f0','#f7b267','#c7a4ff','#ff8fab','#8ecae6','#ffd166'];let layout=list=>{let sorted=[...list].sort((a,b)=>toMin(startOf(a))-toMin(startOf(b))||toMin(endOf(a))-toMin(endOf(b))),out=[],cluster=[],end=-1,flush=()=>{let n=Math.max(1,...cluster.map(x=>x.lane+1));cluster.forEach(x=>out.push({...x,n}));cluster=[]};sorted.forEach(m=>{if(cluster.length&&toMin(startOf(m))>=end){flush();end=-1}let used=cluster.filter(x=>toMin(endOf(x.m))>toMin(startOf(m))).map(x=>x.lane),lane=0;while(used.includes(lane))lane++;cluster.push({m,lane});end=Math.max(end,toMin(endOf(m)))});flush();return out};let html=`<div class="week-grid" style="--hrs:${hrs};--hour:${px}px"><div></div>${days.map((d,i)=>`<div class="day-head ${i===today?'is-today':''}">${d}${i===today?'<small>Today</small>':''}</div>`).join('')}<div class="hours">${Array.from({length:hrs+1},(_,i)=>`<span style="top:${i*px}px">${String(base/60+i).padStart(2,'0')}:00</span>`).join('')}</div>`;for(let wd=0;wd<5;wd++){let blocks=layout(usable.filter(m=>dayIdx(m)===wd)).map(x=>{let c=courses.find(c=>c.course_id===x.m.course_id),ci=courses.indexOf(c),w=100/x.n,t=toMin(startOf(x.m)),b=toMin(endOf(x.m));return `<article class="class-block" style="--c:${colors[(ci<0?0:ci)%colors.length]};top:${(t-base)/60*px}px;height:${Math.max(34,(b-t)/60*px-3)}px;left:calc(${x.lane*w}% + 3px);width:calc(${w}% - 6px)"><b>${esc(x.m.code||c?.code||c?.name||'Class')}</b><span>${esc(c?.name||x.m.kind||'Class')}</span><small>${esc(startOf(x.m))}–${esc(endOf(x.m))} · ${esc(x.m.room||'Room TBD')}</small></article>`}).join(''),line=wd===today&&now>=base&&now<=base+hrs*60?`<i class="now-line" style="top:${(now-base)/60*px}px"></i>`:'';html+=`<div class="day-column ${wd===today?'is-today':''}">${blocks}${line}</div>`}return html+'</div>'}
function daysTo(d){return d?Math.ceil((new Date(d+'T00:00:00')-new Date(new Date().toISOString().slice(0,10)+'T00:00:00'))/86400000):null}
function coursePage(){const t0=new Date().toISOString().slice(0,10);return `<div class="coursegrid">${courses.map(c=>{let exams=(raw.assessment_slots||[]).filter(a=>a.course_id===c.course_id).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9')),next=exams.find(a=>a.date&&a.date>=t0),xs=plan.filter(x=>x.course?.course_id===c.course_id),done=xs.filter(x=>status(x)==='done').length,topics=(c.topics||[]).length,left=next?daysTo(next.date):null,meta=[c.credits!=null?c.credits+' credits':null,c.instructor||null].filter(Boolean).join(' · '),strat=c.conceded?'Conceded':(c.strategy&&String(c.strategy).toLowerCase()!=='default'?c.strategy:null);return `<article class="course"><span class="eyebrow">${esc(c.code)}</span><h3>${esc(c.name)}</h3>${meta?`<p class="meta">${esc(meta)}</p>`:''}<div class="stats"><div><b>${c.minutes_logged==null?'—':(c.minutes_logged/60).toFixed(1)+'h'}</b><span>logged${c.target_grade!=null?' · target '+esc(c.target_grade):''}</span></div><div><b>${left==null?'—':left<0?'passed':left+'d'}</b><span>${next?esc(next.name)+' · '+fmt(next.date):'no dated exam'}</span></div></div><div class="course-progress-line"><span>${done}/${xs.length} ranked tasks done${topics?' · '+topics+' topics':''}</span><i><em style="width:${xs.length?done/xs.length*100:0}%"></em></i></div>${strat?`<p class="meta">Strategy · ${esc(strat)}</p>`:''}${exams.length?`<ul class="assess">${exams.map(a=>`<li><span>${esc(a.name)}<small>${fmt(a.date)} · ${a.weight!=null?a.weight+'%':'weight unknown'}</small></span><em>${a.mark==null?'ungraded':a.mark+'%'}</em></li>`).join('')}</ul>`:''}<a class="linkbtn" href="#/plan?course=${encodeURIComponent(c.course_id)}">View ${xs.length} ranked tasks →</a></article>`}).join('')}</div>`}
function draw(){nav();let p=page();$('#pageTitle').textContent={today:'Today’s agenda',plan:'All ranked tasks',schedule:'Class timetable',courses:'Your courses'}[p];let sem=raw.semester||{};$('#semesterName').textContent=sem.name||'dates unknown';$('#dateLine').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});let days=sem.end?Math.ceil((new Date(sem.end)-new Date())/86400000):null;$('#semesterProgress').textContent=days==null?'Semester end unknown':`${Math.max(0,days)} days to semester end`;$('#app').innerHTML=p==='today'?today():p==='plan'?planPage():p==='schedule'?schedule():coursePage();}
function clock(){return `${String(Math.floor(session.elapsed/60)).padStart(2,'0')}:${String(session.elapsed%60).padStart(2,'0')}`}
function start(uid){let it=item(uid);if(!it||it.lane==='setup')return;startError=null;session={item:it,id:null,elapsed:0,paused:false,mode:it.lane==='review'?'review-quiz':'practice'};draw();if(it.custom){timer=setInterval(tick,1000);return} if(!it.course){session=null;startError='A course is required to start this study session.';draw();return}let body={code:it.course.code,mode:session.mode};if(it.materialId)Object.assign(body,{subject_type:'material',subject_id:it.materialId});else if(it.topicId)Object.assign(body,{subject_type:'topic',subject_id:it.topicId});let s=session;post('/sessions',body).then(v=>{if(session!==s)return;session.id=v.session_id;timer=setInterval(tick,1000)}).catch(e=>{if(session!==s)return;clearInterval(timer);session=null;startError='Could not start the session: '+(e.message||'unknown error')+(e.fix?' '+e.fix:'');draw()});}
function tick(){if(!session.paused){session.elapsed++;let el=$('#timer');if(el)el.textContent=clock()}}
async function stop(){if(!session)return;let s=session;if(!s.id&&!s.item.custom){clearInterval(timer);session=null;draw();return}if(s.id){try{let body={code:s.item.course.code,session_id:s.id,minutes:Math.round(s.elapsed/60)};await post('/sessions/stop',body)}catch(e){$('#err').textContent=e.message||'Could not stop session';return}}clearInterval(timer);if(s.item.uid.startsWith('custom:')){let x=store.custom.find(x=>x.id===s.item.id);if(x)x.done=true}else store.items[s.item.uid]={status:'done'};saveStore();session=null;draw();load();}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let {act,id}=b.dataset;if(act==='theme'){setTheme(id||(themeNow()==='dark'?'light':'dark'));draw();return}if(act==='toggle'){setCollapsed(!collapsed());draw();return}if(act==='start')start(id);if(act==='done'||act==='skip'){if(id.startsWith('custom:')){let t=store.custom.find(x=>x.id===id.slice(7));if(t)t.done=true}else store.items[id]={status:act==='done'?'done':'skipped'};saveStore();draw()}if(act==='stop')stop();if(act==='pause'){session.paused=!session.paused;draw()}});
document.addEventListener('submit',e=>{if(e.target.id!=='add')return;e.preventDefault();let f=new FormData(e.target);store.custom.unshift({id:Math.random().toString(36).slice(2),title:f.get('title'),course:f.get('course')||null,mins:+f.get('mins'),done:false});saveStore();draw()});window.addEventListener('hashchange',draw);
async function load(){let r=await fetch("/state",{headers:{Accept:'application/json'}});if(!r.ok)throw Error('State request failed');adapt(await r.json());draw()}load().catch(e=>$('#app').innerHTML=`<p class="empty">${esc(e.message)}. Check the study server, then reload.</p>`);
</script></body></html>
