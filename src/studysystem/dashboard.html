<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studysystem</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7;--surface:#fff;--fill:rgba(118,118,128,.12);--fill-2:rgba(118,118,128,.2);
  --text:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;--hair:rgba(0,0,0,.09);
  --accent:#0071e3;--accent-soft:rgba(0,113,227,.12);
  --green:#34c759;--green-text:#1d7a36;--red-text:#c9160c;--red-soft:rgba(255,59,48,.12);--orange-text:#b25000;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --bar:rgba(245,245,247,.72);--thumb:#fff;--pop:rgba(255,255,255,.86);
  --spring:cubic-bezier(.3,.7,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000;--surface:#1c1c1e;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.36);
  --text:#f5f5f7;--text-2:#a1a1a6;--text-3:#8e8e93;--hair:rgba(255,255,255,.12);
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.2);
  --green:#30d158;--green-text:#30d158;--red-text:#ff6961;--red-soft:rgba(255,69,58,.2);--orange-text:#ff9f0a;
  --shadow:none;--bar:rgba(0,0,0,.66);--thumb:#636366;--pop:rgba(52,52,54,.88);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000;--surface:#1c1c1e;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.36);
  --text:#f5f5f7;--text-2:#a1a1a6;--text-3:#8e8e93;--hair:rgba(255,255,255,.12);
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.2);
  --green:#30d158;--green-text:#30d158;--red-text:#ff6961;--red-soft:rgba(255,69,58,.2);--orange-text:#ff9f0a;
  --shadow:none;--bar:rgba(0,0,0,.66);--thumb:#636366;--pop:rgba(52,52,54,.88);
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:1.0625rem/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
h1,h2,h3,.num{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* Top bar: a translucent layer; the page scrolls under it */
.bar{position:sticky;top:0;z-index:10;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;gap:12px}
.brand{font-weight:600;font-size:1rem;letter-spacing:-.01em}
.bar-end{display:flex;justify-content:flex-end;align-items:center;gap:12px;color:var(--text-2);font-size:.875rem}
.seg{position:relative;display:flex;background:var(--fill);border-radius:999px;padding:3px}
.seg a{position:relative;z-index:1;padding:6px 20px;border-radius:999px;font-size:.9375rem;font-weight:500;color:var(--text-2);transition:color .2s ease}
.seg a[aria-current="page"]{color:var(--text);font-weight:600}
.seg i{position:absolute;top:3px;bottom:3px;left:0;width:var(--w,0);transform:translateX(var(--x,0));background:var(--thumb);border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.live i{transition:transform .38s var(--spring),width .38s var(--spring)}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:50%;background:var(--fill);cursor:pointer;transition:transform .1s ease-out}
.icon-btn:active{transform:scale(.92)}

/* Page head */
#app{padding:40px 24px 96px}
.page{animation:arrive .36s var(--spring)}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}}
.eyebrow{font-size:.9375rem;font-weight:600;color:var(--text-2)}
h1{font-size:clamp(2.5rem,6vw,3.5rem);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:4px}
h2{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:56px 0 16px}
.sub{color:var(--text-2);margin-top:8px}
.card{background:var(--surface);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.label{font-size:.8125rem;font-weight:600;color:var(--text-2)}
.empty{padding:20px 24px;color:var(--text-2)}
/* D-288: the 3h45m question floats over every page, so Plan or Schedule cannot hide it */
.notice{position:fixed;z-index:30;top:72px;left:50%;width:min(440px,calc(100vw - 32px));transform:translateX(-50%);display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:16px 18px;border-radius:20px;background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 0 0 1px var(--hair),0 18px 48px rgba(0,0,0,.22);animation:drop .45s var(--spring)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
.notice b{font-size:1rem}
.notice p{grid-column:1;font-size:.875rem;color:var(--text-2)}
.notice .acts{grid-row:1/3;grid-column:2;display:flex;gap:8px}
.notice .btn{height:40px;padding:0 18px;font-size:.9375rem}
@media (max-width:560px){.notice{grid-template-columns:1fr}.notice .acts{grid-row:auto;grid-column:1}.notice .btn{flex:1}}
@media (prefers-reduced-transparency:reduce){.notice{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* Stopwatch and the week */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:32px}
.hero>*,.cols>*,.pair>*,.watch-top>*{min-width:0}
.watch{display:flex;flex-direction:column;min-height:340px}
.watch-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.watch-top .label{flex:none}
.pickers{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;min-width:0}
.pickers>*{min-width:0}
.menu{position:relative}
.menu-btn{display:flex;align-items:center;gap:8px;max-width:100%;border:0;border-radius:999px;background:var(--fill);padding:8px 12px 8px 16px;font-size:.9375rem;cursor:pointer;transition:transform .1s ease-out,opacity .2s ease}
.menu-btn:active{transform:scale(.97)}
.menu-btn:disabled{opacity:.5;cursor:default}
.menu-btn b,.opt b{font-weight:600;white-space:nowrap}
.menu-btn span,.opt span{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.menu-btn svg{flex:none;color:var(--text-3)}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:min(340px,calc(100vw - 64px));max-height:min(420px,60vh);overflow-y:auto;padding:6px;border-radius:16px;background:var(--pop);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 0 0 1px var(--hair),0 18px 48px rgba(0,0,0,.22);transform-origin:top right;opacity:0;transform:scale(.9);visibility:hidden;transition:opacity .16s ease,transform .28s var(--spring),visibility 0s .2s}
.pop.open{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.opt{display:grid;grid-template-columns:16px auto 1fr;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;font-size:.9375rem;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--fill);outline:0}
.opt svg{color:var(--accent);opacity:0}
.opt[aria-selected="true"] svg{opacity:1}
.digits{flex:1;display:grid;place-items:center;font-size:clamp(3.5rem,10vw,6rem);font-weight:600;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1;transition:color .3s ease}
.watch.running .digits{color:var(--green-text)}
.status{min-height:1.5em;text-align:center;color:var(--text-2);font-size:.9375rem;margin-bottom:20px}
.status.err{color:var(--red-text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-grid;place-items:center;height:52px;padding:0 28px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;transition:transform .1s ease-out,background-color .2s ease,opacity .2s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.stop{background:var(--red-soft);color:var(--red-text)}
.watch .btn{align-self:center;min-width:200px}
.watch-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.watch-actions .btn{min-width:150px}
.status.ask{color:var(--orange-text);font-weight:500}
.wtabs{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;flex:none}
.wtab{border:0;background:none;padding:6px 16px;border-radius:999px;font-size:.9375rem;font-weight:500;color:var(--text-2);cursor:pointer;transition:color .2s ease,background-color .2s ease}
.wtab[aria-selected="true"]{background:var(--thumb);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.runstrip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--fill)}
.runstrip .num{color:var(--green-text);font-weight:600;font-variant-numeric:tabular-nums}
.runstrip .btn{height:36px;min-width:0;padding:0 16px;margin-left:auto}
.runstrip .err{flex-basis:100%;color:var(--red-text);font-size:.875rem}
.logform{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:16px}
.lf-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.lf-field{display:flex;flex-direction:column;gap:6px;font-size:.8125rem;font-weight:600;color:var(--text-2);min-width:0}
.lf-field input{font:inherit;font-size:.9375rem;font-weight:400;color:var(--text);border:0;background:var(--fill);border-radius:10px;padding:9px 12px;min-height:38px;font-variant-numeric:tabular-nums}
.lf-field input[name="minutes"]{width:7em}
.lf-hint{margin:0;color:var(--text-2);font-size:.8125rem}
.logform .status{margin:0}
.logform .pop{left:0;right:auto;transform-origin:top left}

.side{display:grid;gap:20px;grid-template-rows:1fr auto}
.week{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:112px;height:112px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .track{stroke:var(--fill)}
.ring.none .track{stroke-dasharray:4 10;stroke-linecap:butt}
.ring .fill{stroke:var(--accent);transition:stroke-dashoffset .9s var(--spring),stroke .3s ease}
.ring.met .fill{stroke:var(--green)}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.muted{color:var(--text-2);font-size:.9375rem}
.risk{color:var(--orange-text);font-size:.9375rem;font-weight:500}
.bars{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:72px;margin-top:4px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:.75rem;color:var(--text-3)}
.bars b{display:block;width:100%;max-width:28px;min-height:4px;border-radius:6px;background:var(--fill-2)}
.bars .today b{background:var(--accent)}
.bars .today{color:var(--text);font-weight:600}
.quiet.edit{padding:4px 0;margin-top:2px}
.goal{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px}
.goal input{width:5.5em;border:0;background:var(--fill);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums}
.goal .err{flex-basis:100%;color:var(--red-text);font-size:.875rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tile{padding:20px 24px}

/* Grouped lists */
.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;align-items:start}
.list{padding:0;overflow:hidden}
.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:18px 24px 10px}
.list-head b{font-size:1.0625rem}
.head-end{display:flex;align-items:center;gap:10px}
.fold-btn{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:var(--fill);color:var(--text-2);cursor:pointer;padding:0;transition:transform .1s ease-out}
.fold-btn:active{transform:scale(.92)}
.fold-btn svg{transform:rotate(90deg);transition:transform .3s var(--spring)}
.fold-btn.up svg{transform:rotate(-90deg)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 24px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:24px;right:0;height:1px;background:var(--hair)}
.row time{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9375rem;min-width:3.2em}
.row time small{display:block;font-weight:400;color:var(--text-3);font-size:.8125rem}
.row .t{font-weight:500;line-height:1.3}
.row .m{font-size:.875rem;color:var(--text-2)}
.row.past{opacity:.45}
.tag{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--text-2);white-space:nowrap}
.tag.now{background:var(--accent-soft);color:var(--accent)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--text-3);background:none;cursor:pointer;display:grid;place-items:center;transition:transform .1s ease-out,background-color .2s ease,border-color .2s ease;padding:0;flex:none}
.check:active{transform:scale(.88)}
.check svg{opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .3s var(--spring)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"] svg{opacity:1;transform:none}
.row.done .t{color:var(--text-3);text-decoration:line-through}
.quiet{border:0;background:none;color:var(--accent);font-size:.9375rem;cursor:pointer;padding:6px 4px}
.add{display:flex;gap:10px;padding:12px 24px 18px;border-top:1px solid var(--hair)}
.add input{flex:1;border:0;background:var(--fill);border-radius:12px;padding:10px 14px;min-width:0}
.add .menu{flex:none;display:flex;position:static}
/* the Tasks card lets the course menu spill out; the menu opens upward, above the form, lined up
   with the form's right side so a phone shows all of it */
#taskrows{overflow:visible}
.add{position:relative}
.add .pop{top:auto;right:24px;bottom:calc(100% + 8px);transform-origin:bottom right}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.hon .muted{margin:2px 0 12px}
.hon .big{margin-top:4px}
.hon-rows{list-style:none;padding:0;margin:8px 0 0}
.hon-rows li{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:4px 12px;padding:9px 0;border-top:1px solid var(--hair);font-size:.9375rem}
.hon-rows li small{grid-column:1/-1;color:var(--text-3);font-size:.8125rem}
.hon-rows em{font-style:normal;color:var(--text-2);text-align:right}
.hon-rows b{font-weight:600;font-variant-numeric:tabular-nums}
.hon-rows.plain li{display:flex;justify-content:space-between;gap:12px}
.hon-rows.plain li small{display:inline;margin-left:6px}
.hon .meta{font-size:.8125rem;color:var(--text-3);margin-top:8px}
.hon-sub{margin-top:14px}

/* Courses */
/* D-291: each card takes its row's height; the foot sits at the bottom, so the folds line up */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.course{display:flex;flex-direction:column}
.course .foot{margin-top:auto;padding-top:16px}
.course h3{font-size:1.25rem;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin:2px 0 4px}
.course .meta{font-size:.875rem;color:var(--text-2)}
.course .meta small{display:block;font-size:.8125rem;color:var(--text-3)}
.code{display:flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600;color:var(--text-2)}
.code i{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 68% 52%)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stats b{display:block;font-size:1.375rem;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.stats span{font-size:.8125rem;color:var(--text-2)}
.assess{list-style:none;padding:0;margin:14px 0 0}
.assess li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--hair);font-size:.9375rem}
.assess small{display:block;color:var(--text-2);font-size:.8125rem}
.assess em{font-style:normal;color:var(--text-2);white-space:nowrap}
.foot{margin:16px -24px -24px}
.foot>*{border-top:1px solid var(--hair);padding:0 24px}
.fold summary{list-style:none;cursor:pointer;padding:14px 0;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:.9375rem;font-weight:500}
.fold summary::-webkit-details-marker{display:none}
.fold summary span{color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:400}
.fold summary svg{transition:transform .3s var(--spring);color:var(--text-3)}
.fold[open] summary svg{transform:rotate(90deg)}
.fold p{font-size:.9375rem;color:var(--text-2);padding-bottom:16px}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.meter em{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s var(--spring)}
.paper{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:.9375rem;cursor:pointer}
.paper:last-child{padding-bottom:18px}
.paper.done span{color:var(--text-3)}
.foot .nopapers,.foot .planlink{display:block;padding-top:14px;padding-bottom:14px;font-size:.9375rem}
.nopapers{color:var(--text-2)}
.planlink{font-weight:500}

/* Plan */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{padding:6px 14px;border-radius:999px;background:var(--fill);color:var(--text-2);font-size:.875rem;font-weight:500;transition:transform .1s ease-out}
.chip:active{transform:scale(.96)}
.chip[aria-current="true"]{background:var(--text);color:var(--bg)}
/* D-302: a 2x2 grid; each lane spans two rows of it (heading, card), so the headings line up and
   the two cards in a row stretch to one height */
.lanes{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.lanes>.lane{display:grid;grid-row:span 2;grid-template-rows:subgrid;min-width:0}
.lane h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.lane h2 small{font-size:1rem;font-weight:500;color:var(--text-2);letter-spacing:0}
.lane .list-head{padding-bottom:6px}
.rank{font-variant-numeric:tabular-nums;color:var(--text-3);font-weight:600;min-width:1.6em}
.why summary{cursor:pointer;font-size:.8125rem;color:var(--accent);margin-top:4px;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why p{font-size:.875rem;color:var(--text-2);margin-top:4px}

/* Week grid */
.gridwrap{overflow-x:auto;padding:20px 20px 20px 8px}
.grid{display:grid;grid-template-columns:52px repeat(5,minmax(116px,1fr));min-width:680px}
.grid .dh{text-align:center;font-size:.875rem;font-weight:600;color:var(--text-2);padding-bottom:12px}
.grid .dh.today{color:var(--accent)}
.hours,.day{position:relative;height:calc(var(--hrs)*56px)}
.hours span{position:absolute;right:10px;transform:translateY(-50%);font-size:.75rem;color:var(--text-3);font-variant-numeric:tabular-nums}
.day{border-left:1px solid var(--hair);background:repeating-linear-gradient(to bottom,var(--hair) 0 1px,transparent 1px 56px)}
.blk{position:absolute;border-radius:10px;padding:6px 9px;background:hsl(var(--h) 70% 52%/.16);border-left:3px solid hsl(var(--h) 68% 50%);font-size:.75rem;line-height:1.3;overflow:hidden}
.blk b{display:block;font-size:.8125rem}
.blk span{color:var(--text-2)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

@media (max-width:860px){
  .hero,.cols,.pair,.lanes{grid-template-columns:1fr}
  .watch{min-height:300px}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  #app{padding:28px 16px 80px}
  .bar .wrap{grid-template-columns:1fr auto}
  .brand,.bar-end span{display:none}
  .seg a{padding:6px 14px}
  .watch-top{flex-wrap:wrap}
  .pickers{justify-content:flex-start;width:100%}
  h2{margin-top:44px}
  .row,.list-head,.add{padding-left:16px;padding-right:16px}
  .add .pop{right:16px}
  .row+.row::before{left:16px}
  .courses{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.15s!important}
  .page{animation:none}
  .btn:active,.check:active,.icon-btn:active,.menu-btn:active,.chip:active,.fold-btn:active{transform:none}
}
@media (prefers-reduced-transparency:reduce){.bar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}.pop{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast:more){.card{border:1px solid var(--text-3)}.bar{background:var(--bg)}}
</style>

<body>
<header class="bar"><div class="wrap">
  <div class="brand">Studysystem</div>
  <nav class="seg" id="seg" aria-label="Pages"><i></i><a href="#/plan" data-p="plan">Plan</a><a href="#/today" data-p="today">Today</a><a href="#/schedule" data-p="schedule">Schedule</a></nav>
  <div class="bar-end"><span id="barDate"></span>
    <button class="icon-btn" type="button" data-act="theme" aria-label="Switch light or dark theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>
</div></header>
<div id="notice" role="alert"></div>
<main class="wrap" id="app"><p class="empty">Loading semester data…</p></main>

<script>
// The page shows what GET /state sends and ranks nothing (D-19, D-163). Look: D-283, D-285.
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=isoDay(new Date());
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'}):'date unknown';
const daysTo=d=>d?Math.round((new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000):null;
const hm=m=>m<60?m+'m':Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':'');
const TICK='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.6l4.5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const WHITE_TICK=TICK.replace('currentColor','#fff');
const CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROWS='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const RING=326.73; // the ring's circumference: 2 x pi x 52

// ---- what the browser keeps: today's ticks, personal tasks, paper ticks, the picked course
function read(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v&&typeof v==='object'&&!Array.isArray(v)?v:fallback}catch(e){return fallback}}
function write(key,value){try{value==null?localStorage.removeItem(key):localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
const isMap=v=>v&&typeof v==='object'&&!Array.isArray(v);
let store=read('semcon.state.v2',{});
if(store.day!==TODAY){store.day=TODAY;store.items={}}       // a plan tick lasts one day
if(!isMap(store.items))store.items={};
if(!isMap(store.papers))store.papers={};                    // D-285: a paper tick stays
store.custom=Array.isArray(store.custom)?store.custom:[];
const saveStore=()=>write('semcon.state.v2',store);
saveStore();
try{const t=localStorage.getItem('semcon.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}

// ---- state from the server
let raw=null,plan=[],courses=[],meetings=[],first=true,openFolds=new Set();
function adapt(s){
  raw=s;courses=s.courses||[];meetings=s.timetable?.meetings||[];plan=[];
  const lanes=s.plan?.current?.lanes;if(!lanes)return;
  const course=id=>courses.find(c=>c.course_id===id)||null;
  for(const lane of ['review','study','setup']){
    const l=lanes[lane];if(!l)continue;
    const grouped=new Set((l.entries||[]).flatMap(e=>e.topic_ids||[]));
    for(const i of l.items||[]){
      if(grouped.has(i.topic_id))continue;
      plan.push({uid:lane+':'+(i.setup_key||i.topic_id||i.rank),lane,rank:i.rank,course:course(i.course_id),
        what:lane==='setup'?i.reason:(i.topic_name||i.reason||'Study item'),chapter:i.chapter||null,why:i.reason||null,mins:i.estimated_minutes??null});
    }
    for(const e of l.entries||[]){ // one chapter's topics, grouped by the server (D-240)
      const ids=e.topic_ids||[];
      plan.push({uid:lane+':'+(e.material_id||ids[0]||e.rank),lane,rank:e.rank,course:course(e.course_id),
        what:(e.topics||[]).join(', ')||e.chapter||'Study item',chapter:e.chapter||null,
        why:(l.items||[]).filter(i=>ids.includes(i.topic_id)).map(i=>i.reason).filter(Boolean).join(' · ')||null,mins:e.estimated_minutes??null});
    }
  }
}
const status=it=>store.items[it.uid]?.status||'upcoming';
const hue=c=>(Math.max(0,courses.indexOf(c))*47+210)%360;
const page=()=>{const p=location.hash.replace('#/','').split(/[/?]/)[0];return ['plan','today','schedule'].includes(p)?p:'today'};
const param=k=>new URLSearchParams(location.hash.split('?')[1]||'').get(k);
// A request that never reaches the server (it is stopped) fails before any answer: say so plainly.
const DOWN={code:'server_down',message:'The dashboard server is not running.'};
async function post(path,body){let r;try{r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)})}catch(x){throw DOWN}const v=await r.json();if(!r.ok)throw v;return v}

// ---- the stopwatch (D-284): Start opens a session on the picked course, Stop logs its minutes
let session=read('semcon.session.v1',null),busy=false,note=null;
// D-287: the picker lists his main courses first, these two last, and starts on I3301 until he picks.
const LAST_COURSES=['DHR300','English L3'],DEFAULT_COURSE='I3301';
const pickList=()=>[...courses].sort((a,b)=>LAST_COURSES.includes(a.code)-LAST_COURSES.includes(b.code)); // a stable sort keeps code order
const picked=()=>courses.find(c=>c.code===store.course)||courses.find(c=>c.code===DEFAULT_COURSE)||pickList()[0]||null;
// D-287: the session's mode, his pick; Practice when he picks none. The server's five modes (MODES).
const MODES=[['practice','Practice','Solve problems'],['review-quiz','Review quiz','Test what you studied'],['exam-walkthrough','Past exam','Walk through a paper'],['mock','Mock exam','A timed full paper'],['explain-chapter','Learn a chapter','Read and understand']];
const DEFAULT_MODE='practice';
const pickedMode=()=>MODES.find(m=>m[0]===store.mode)||MODES.find(m=>m[0]===DEFAULT_MODE);
const modeName=id=>(MODES.find(m=>m[0]===id)||[id,id])[1];
const clock=()=>{const s=Math.max(0,Math.floor((Date.now()-session.t0)/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(pad).join(':')};
const said=e=>(e?.message||'the server gave no reason')+(e?.fix?' '+e.fix:'');
// D-288: the server ends a session 4 hours after its start and then logs nothing (D-198). At 3h45m
// the page asks; with no answer it stops the session itself at 3h55m - five minutes early, because
// a browser runs a hidden tab's timers only about once a minute.
const ASK_AT=225*60,END_AT=235*60,EXPIRED_AT=240*60;
const elapsed=()=>session?Math.max(0,Math.floor((Date.now()-session.t0)/1000)):0;
let autoTried=false,askShown=false;
async function open(code,mode){const v=await post('/sessions',{code,mode});session={id:v.session_id,code,mode,t0:Date.now()};write('semcon.session.v1',session);autoTried=false;askShown=false}
async function start(){
  const c=picked();if(!c||session||busy)return;
  busy=true;note=null;draw();
  try{await open(c.code,pickedMode()[0])}
  catch(e){note={err:true,text:e?.code==='server_down'?'Could not start: the dashboard server is not running. Start it, then press Start again.':'Could not start: '+said(e)}}
  busy=false;draw();
}
async function stop(how){
  if(!session||busy)return;
  if(elapsed()>=EXPIRED_AT){  // the server already ended it and logs nothing (D-198): end it here
    note={err:true,text:`This session passed 4 hours, so it ended without logging. Log your real minutes on ${session.code} in your study chat.`};
    session=null;write('semcon.session.v1',null);draw();return;
  }
  const s=session;busy=true;note=null;draw();
  try{
    const v=await post('/sessions/stop',{code:s.code,session_id:s.id,minutes:Math.round((Date.now()-s.t0)/60000)});
    const logged=v.hours_entry_id?`Logged ${hm(v.minutes)} on ${s.code}.`:'Under 1 minute. Nothing logged.';
    session=null;write('semcon.session.v1',null);
    if(how==='continue'){
      try{await open(s.code,s.mode||DEFAULT_MODE);note={text:logged+' A new session continues.'}}
      catch(e){note={err:true,text:logged+' Could not start the next session: '+(e?.code==='server_down'?'the dashboard server is not running.':said(e))}}
    }else note={text:how==='auto'?`Stopped before the 4-hour limit. ${logged} Press Start to keep going.`:logged};
  }catch(e){
    note={err:true,text:e?.code==='server_down'?'Could not stop: the dashboard server is not running. Your session is kept: start the server, then press Stop again.':'Could not stop: '+said(e)};
    if(['session_expired','session_ended','not_found'].includes(e?.code)){session=null;write('semcon.session.v1',null)} // nothing left to stop
  }
  busy=false;draw();load().catch(()=>{});
}
setInterval(()=>{
  if(!session)return;
  const el=$('#digits');if(el)el.textContent=clock();const el2=$('#stripdigits');if(el2)el2.textContent=clock();
  const t=elapsed();
  if(t>=END_AT&&!busy&&!autoTried){autoTried=true;stop('auto')}  // once: a failed stop stays shown
  else if(t>=ASK_AT&&!askShown){askShown=true;draw()}
  else paintNotice();  // the minutes so far, and gone past 4h
},500);
const watchCourse=()=>session?courses.find(x=>x.code===session.code)||{code:session.code,name:''}:picked();
function stopwatchView(left){
  const c=watchCourse();
  const m=session?[session.mode,modeName(session.mode||DEFAULT_MODE)]:pickedMode(),off=session||busy?'disabled':'';
  const asking=session&&!note?.err&&elapsed()>=ASK_AT;
  const line=session&&note?.err?esc(note.text):asking?'Still studying? At 3h55m this session stops and logs itself.':session&&note?`<i class="dot"></i>${esc(note.text)} Started ${esc(new Date(session.t0).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}))}.`:session?`<i class="dot"></i>Studying ${esc(session.code)}${session.mode?' · '+esc(modeName(session.mode)):''} · started ${esc(new Date(session.t0).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}))}`:esc(note?.text||'Pick a course and a mode, then press Start.');
  return `<div class="watch-top">${left}
      <div class="pickers">
        <div class="menu"><button class="menu-btn" id="courseBtn" type="button" data-act="menu" data-id="course" aria-haspopup="listbox" aria-expanded="false" aria-label="Course to study" ${off}><b>${esc(c.code)}</b><span>${esc(c.name)}</span>${ARROWS}</button>
          <div class="pop" id="coursePop" role="listbox" aria-label="Courses">${pickList().map(x=>`<button type="button" class="opt" role="option" data-act="pick" data-menu="course" data-id="${esc(x.code)}" aria-selected="${x===c}">${TICK}<b>${esc(x.code)}</b><span>${esc(x.name)}</span></button>`).join('')}</div></div>
        <div class="menu"><button class="menu-btn" id="modeBtn" type="button" data-act="menu" data-id="mode" aria-haspopup="listbox" aria-expanded="false" aria-label="Session mode" ${off}><b>${esc(m[1])}</b>${ARROWS}</button>
          <div class="pop" id="modePop" role="listbox" aria-label="Session modes">${MODES.map(([id,name,what])=>`<button type="button" class="opt" role="option" data-act="pick" data-menu="mode" data-id="${esc(id)}" aria-selected="${id===m[0]}">${TICK}<b>${esc(name)}</b><span>${esc(what)}${id===DEFAULT_MODE?' · default':''}</span></button>`).join('')}</div></div>
      </div></div>
    <div class="digits num" id="digits">${session?clock():'00:00:00'}</div>
    <div class="status ${note?.err?'err':asking?'ask':''}" role="status">${line}</div>
    ${asking?`<div class="watch-actions"><button class="btn" type="button" data-act="continue" ${busy?'disabled':''}>Continue</button><button class="btn stop" type="button" data-act="stop" ${busy?'disabled':''}>Stop</button></div>`
      :`<button class="btn ${session?'stop':''}" type="button" data-act="${session?'stop':'start'}" ${busy?'disabled':''}>${session?'Stop':'Start'}</button>`}`;
}
const MENUS=['course','mode','taskCourse','logCourse'];
function menu(name,open){for(const n of MENUS){const p=$('#'+n+'Pop'),b=$('#'+n+'Btn');if(!p||!b)continue;const on=open&&n===name;p.classList.toggle('open',on);b.setAttribute('aria-expanded',on);if(on)p.querySelector('[aria-selected="true"]')?.focus()}}
const openMenu=()=>MENUS.find(n=>$('#'+n+'Pop')?.classList.contains('open'))||null;

// ---- Today: log past hours in the stopwatch card (D-307, D-309)
// Two tabs; a running stopwatch stays in a strip on the Log tab
const MODE_NAME={stopwatch:'Stopwatch',log:'Log past hours'};
const watchMode=()=>store.watchTab==='log'?'log':'stopwatch';
const logDraft={code:null,minutes:'',date:null,time:'',busy:false,msg:null};
const logCourse=()=>pickList().find(c=>c.code===logDraft.code)||watchCourse();
function tabsHead(mode){
  return `<div class="wtabs" role="tablist" aria-label="How to record time">${['stopwatch','log'].map(id=>`<button class="wtab" type="button" role="tab" id="wtab-${id}" aria-selected="${mode===id}" aria-controls="wpanel" tabindex="${mode===id?0:-1}" data-act="wtab" data-id="${id}">${MODE_NAME[id]}</button>`).join('')}</div>`;
}
function runStrip(){
  return `<div class="runstrip"><i class="dot"></i><span class="num" id="stripdigits">${clock()}</span><span class="muted">${esc(session.code)}${session.mode?' · '+esc(modeName(session.mode)):''}</span><button class="btn stop" type="button" data-act="stop" ${busy?'disabled':''}>Stop</button>${note?.err?`<p class="err">${esc(note.text)}</p>`:''}</div>`;
}
function logView(left){
  const c=logCourse(),d=logDraft,off=d.busy?'disabled':'';
  const pop=pickList().map(x=>`<button type="button" class="opt" role="option" data-act="pick" data-menu="logCourse" data-id="${esc(x.code)}" aria-selected="${x.code===c.code}">${TICK}<b>${esc(x.code)}</b><span>${esc(x.name)}</span></button>`).join('');
  return `<div class="watch-top">${left}</div>${session?runStrip():''}
    <form class="logform" id="logform">
      <div class="lf-row">
        <div class="lf-field"><span id="lfCourseLabel">Course</span>
          <div class="menu"><button class="menu-btn" id="logCourseBtn" type="button" data-act="menu" data-id="logCourse" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="lfCourseLabel logCourseBtn" ${off}><b>${esc(c.code)}</b><span>${esc(c.name)}</span>${ARROWS}</button>
            <div class="pop" id="logCoursePop" role="listbox" aria-label="Courses">${pop}</div></div></div>
        <label class="lf-field">Minutes<input name="minutes" type="number" inputmode="numeric" min="1" max="720" step="1" required value="${esc(d.minutes)}" aria-label="Minutes studied, 1 to 720" ${off}></label>
      </div>
      <div class="lf-row">
        <label class="lf-field">Date<input name="date" type="date" required max="${TODAY}" value="${esc(d.date||TODAY)}" aria-label="Date studied" ${off}></label>
        <label class="lf-field">Time (optional)<input name="time" type="time" value="${esc(d.time)}" aria-label="Start time, optional" ${off}></label>
      </div>
      <p class="lf-hint">Date only: counted as ending that day (today: ending now).</p>
      <div class="status ${d.msg?.err?'err':''}" role="status">${d.msg?esc(d.msg.text):''}</div>
      <button class="btn" type="submit" ${off}>${d.busy?'Logging…':'Log'}</button>
    </form>`;
}
function watch(){
  const c=watchCourse();
  if(!c)return `<div class="card watch"><div class="watch-top"><span class="label">Stopwatch</span></div><div class="digits num">00:00:00</div><div class="status">Add a course to use the stopwatch.</div></div>`;
  const mode=watchMode(),cls=`card watch ${session?'running':''}`;
  const left=tabsHead(mode);
  return `<div class="${cls}" role="tabpanel" id="wpanel" aria-labelledby="wtab-${mode}">${mode==='log'?logView(left):stopwatchView(left)}</div>`;
}
async function logHours(f){
  const d=logDraft,c=logCourse();if(d.busy||!c)return;
  const fd=new FormData(f);d.minutes=String(fd.get('minutes')||'');d.date=String(fd.get('date')||'');d.time=String(fd.get('time')||'');
  const minutes=Number(d.minutes),date=d.date||TODAY;
  if(!Number.isInteger(minutes)||minutes<1||minutes>720){d.msg={err:true,text:'Not logged: minutes must be a whole number from 1 to 720.'};draw();return}
  if(date>TODAY){d.msg={err:true,text:'Not logged: the date cannot be in the future.'};draw();return}
  d.busy=true;d.msg=null;draw();
  try{
    await post('/hours',{code:c.code,minutes,started_at:d.time?`${date}T${d.time}`:date});
    d.minutes='';d.msg={text:`Logged ${minutes} min on ${c.code} · ${fmt(date)}`};d.busy=false;
    try{await load()}catch(x){d.msg.text+='. The page could not refresh: reload it.';draw()}
  }catch(e){d.busy=false;d.msg={err:true,text:e?.code==='server_down'?'Not logged: the dashboard server is not running.':'Not logged: '+said(e)};draw()}
  $('#logform input[name="minutes"]')?.focus();
}

// ---- Today: the week, today's minutes, the streak (D-286)
// D-290: "Edit target" writes a new capacity row from the Monday of this week, through POST /capacity.
const GOAL_CLOSED={open:false,draft:null,busy:false,err:null};
let goalEdit={...GOAL_CLOSED};
const monday=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return isoDay(d)};
async function saveGoal(hours){
  goalEdit.busy=true;goalEdit.err=null;draw();
  try{await post('/capacity',{hours_per_week:hours,from_date:monday()});goalEdit={...GOAL_CLOSED};await load()}
  catch(e){goalEdit.busy=false;goalEdit.err=e?.code==='server_down'?'Not saved: the dashboard server is not running.':'Not saved: '+said(e);draw()}
}
function goalForm(hours){
  if(!goalEdit.open)return `<button class="quiet edit" type="button" data-act="goal">${hours==null?'Set target':'Edit target'}</button>`;
  const v=goalEdit.draft??(hours==null?'':String(hours)),off=goalEdit.busy?'disabled':'';
  return `<form class="goal" id="goal"><input name="hours" type="number" inputmode="decimal" min="0.5" max="112" step="any" required value="${esc(v)}" aria-label="Weekly target in hours" ${off}><span class="muted">h/week</span><button class="quiet" type="submit" ${off}>Save</button><button class="quiet" type="button" data-act="goal-cancel" ${off}>Cancel</button>${goalEdit.err?`<p class="err">${esc(goalEdit.err)}</p>`:''}</form>`;
}
function weekCard(){
  const t=raw.study_time,total=t.week_days.reduce((a,b)=>a+b,0),hours=raw.capacity?.declared_hours_per_week,target=hours==null?null:Math.round(hours*60);
  const share=target?Math.min(1,total/target):0,top=Math.max(...t.week_days,target?target/7:60),wd=(new Date().getDay()+6)%7;
  return `<div class="card week">
    <svg class="ring ${target==null?'none':''} ${target&&total>=target?'met':''}" viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" id="ringfill" cx="60" cy="60" r="52" stroke-dasharray="${RING}" stroke-dashoffset="${first?RING:RING*(1-share)}" data-to="${RING*(1-share)}"/></svg>
    <div><div class="label">This week</div><div class="big num">${hm(total)}</div><div class="muted">${target==null?'No weekly target set':`of ${hm(target)} target · ${Math.round(total/target*100)}%`}</div>${goalForm(hours)}</div>
    <div class="bars">${t.week_days.map((m,i)=>`<div class="${i===wd?'today':''}" title="${hm(m)}"><b style="height:${Math.round(m/top*100)}%"></b>${'MTWTFSS'[i]}</div>`).join('')}</div>
  </div>`;
}
function tiles(){
  const t=raw.study_time,n=t.streak_days;
  return `<div class="tiles">
    <div class="card tile"><div class="label">Today</div><div class="big num">${hm(t.today_minutes)}</div><div class="muted">studied</div></div>
    <div class="card tile"><div class="label">Streak</div><div class="big num">${n} ${n===1?'day':'days'}</div>${t.streak_at_risk?'<div class="risk">Study today to keep it</div>':`<div class="muted">${n?'in a row':'No streak yet'}</div>`}</div>
  </div>`;
}

// ---- Today: classes and tasks. Setup items stay on the Plan page (D-285).
function classes(){
  const wd=new Date().getDay()||7,now=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  const xs=meetings.filter(m=>m.weekday===wd).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  return `<div class="card list"><div class="list-head"><b>Classes</b><span class="muted">${xs.length} today</span></div>${xs.length?xs.map(m=>{
    const c=courses.find(c=>c.course_id===m.course_id),kind=m.kind?m.kind[0].toUpperCase()+m.kind.slice(1):'Class';
    return `<div class="row ${m.end&&m.end<=now?'past':''}"><time>${esc(m.start)}<small>${esc(m.end)}</small></time><div><div class="t">${esc(m.code||c?.code||'Class')}${c?' · '+esc(c.name):''}</div><div class="m">${esc(kind)} · ${m.room?esc(m.room):'room unknown'}</div></div>${m.start<=now&&now<m.end?'<span class="tag now">Now</span>':''}</div>`}).join(''):'<p class="empty">No classes today.</p>'}</div>`;
}
const LANE_NAME={review:'Review',study:'Study',setup:'Setup',custom:'Personal'};
// his own tasks, as Today shows them: open ones and ones ticked today (Plan reads them too, D-302)
const personal=()=>store.custom.filter(x=>!x.done||x.doneDay===TODAY).map(x=>({uid:'custom:'+x.id,custom:x,lane:'custom',what:x.title,course:courses.find(c=>c.code===x.course)||null,chapter:null,mins:x.mins??null}));
function todayTasks(){

// ---- Today: the honesty panel - four numbers, never blended (D-12, D-304)
const hrs=h=>(Math.round(h*10)/10)+' h';
const honCard=(label,sub,body,title)=>`<div class="card hon"${title?` title="${esc(title)}"`:''}><div class="label">${label}</div><p class="muted">${sub}</p>${body}</div>`;
function coverageCard(){
  const rows=pickList().map(c=>{const r=c.coverage;
    return r?`<li title="${esc(r.tier_note)}"><span class="code" style="--h:${hue(c)}"><i></i>${esc(c.code)}</span><b class="num">${(r.value*100).toFixed(0)}%</b><em>${esc(r.denominator_tier)}</em><small>${esc(r.tier_note)} · plan of ${fmt(r.computed_at.slice(0,10))}</small></li>`
      :`<li><span class="code" style="--h:${hue(c)}"><i></i>${esc(c.code)}</span><b class="num">—</b><em>${esc(c.coverage_tier||'unknown')}</em><small>unknown - no reading yet</small></li>`}).join('');
  return honCard('Coverage at exam','How much of each course the plan reaches by its exam, one figure per course.',rows?`<ul class="hon-rows">${rows}</ul>`:'<p class="muted">No courses yet.</p>');
}
function adherenceCard(){
  const a=raw.metrics?.adherence;
  if(!a)return honCard('Adherence this week','Share of this week’s logged minutes that went to a shown plan item.','<div class="big num">—</div><div class="muted">no reading yet</div>');
  const off=Object.entries(a.deviations||{}).filter(([,m])=>m>0),mi=a.missing_input||0;
  const list=off.map(([r,m])=>`<li><span>${esc(r)}</span><em>${m} min</em></li>`).concat(mi?[`<li><span>missing input</span><em>${mi} min</em></li>`]:[]).join('');
  return honCard('Adherence this week','Share of this week’s logged minutes that went to a shown plan item.',
    `<div class="big num">${a.adherence==null?'—':Math.round(a.adherence*100)+'%'}</div><div class="muted">${a.adherence==null?'no minutes to score':`${a.in_plan} of ${a.minutes-mi} minutes went to a shown plan item`}</div>
    <p class="meta">${a.week_start?'Week of '+fmt(a.week_start):'This week'}</p>${list?`<ul class="hon-rows plain">${list}</ul>`:'<p class="meta">No off-plan minutes.</p>'}${mi?'<p class="meta">Missing input is a gap in what was logged, not a miss.</p>':''}`);
}
function sensitivityCard(){
  const g=raw.metrics?.guess_sensitivity;
  if(!g)return honCard('Guess sensitivity','How much the top of the plan leans on inferred exam edges.','<div class="big num">—</div><div class="muted">not measurable yet</div>');
  return honCard('Guess sensitivity','How much the top of the plan leans on inferred exam edges.',`<div class="big num">${g.changed==null?'—':g.changed+' of '+g.shown}</div><div class="muted">${g.changed==null?'not measurable yet':'top topics changed by dropping inferred exam edges'}</div>`,'the latest plan ranked again with every inferred exam edge dropped (D-280)');
}
function shortfallCard(){
  const f=raw.shortfall,sub='Study hours needed against hours declared free, up to the last exam.';
  if(!f)return honCard('Shortfall',sub,'<div class="big num">—</div><div class="muted">unknown - no reading yet</div>');
  const known=f.gap!=null&&f.capacity!=null;
  const verdict=!known?'unknown - no exam ahead':f.short?`short by ${hrs(-f.gap)}`:`no shortfall, ${hrs(f.gap)} to spare`;
  const nc=(f.not_counted||[]).map(n=>`${esc(n.code)} (${esc(n.reason)})`).join(' · ');
  const offers=(f.offers||[]).map(o=>`<li><span>${esc(o.kind)}${o.code?' · '+esc(o.code):''}</span><em>${hrs(o.hours)}</em></li>`).join('');
  return honCard('Shortfall',sub,
    `<div class="big num">${verdict}</div>
    <ul class="hon-rows plain"><li><span>Need <small>${esc(f.need_tier)}</small></span><em>${f.need==null?'unknown':hrs(f.need)}</em></li><li><span>Capacity <small>${esc(f.capacity_tier)}</small></span><em>${f.capacity==null?'unknown':hrs(f.capacity)}</em></li></ul>
    ${nc?`<p class="meta">Not counted: ${nc}</p>`:''}${offers?`<p class="label hon-sub">Offers, in order</p><ul class="hon-rows plain">${offers}</ul>`:''}`);
}
const honesty=()=>`<h2>How the plan is doing</h2><p class="sub">Four separate numbers. The page never blends them into one score.</p><div class="pair">${coverageCard()}${adherenceCard()}</div><div class="pair">${sensitivityCard()}${shortfallCard()}</div>`;

      <div class="foot">${unconfirmed(c)}${papers(c)}${xs.length?`<a class="planlink" href="#/plan?course=${encodeURIComponent(c.course_id)}">View ${xs.length} ranked ${xs.length===1?'task':'tasks'}</a>`:''}</div></article>`}).join('')}</div>`;

// ---- Plan: study, then review, then setup (D-285), each in the server's rank order
const LANES={study:['Study','Topics to learn, ranked by exam stakes and effort.'],review:['Review','Revision of topics you already studied.'],setup:['Setup','Get material in: past papers and chapters the plan still needs.']};
function planPage(){
  const own=personal(),created=raw.plan?.current?.created_at,cf=param('course')||'all',withItems=courses.filter(c=>plan.some(x=>x.course===c)||own.some(x=>x.course===c));

    <p class="sub">Study first, then review, then setup. The server ranks; this page only shows. Your own tasks sit beside Study, unranked.</p>

    <div class="lanes">${rankedLane('study',cf)}${personalLane(own,cf)}${rankedLane('review',cf)}${rankedLane('setup',cf)}</div>`;

// D-302: Study and Personal side by side, Review and Setup under them; each row's cards share one height
function rankedLane(k,cf){
      const [name,desc]=LANES[k],xs=plan.filter(x=>x.lane===k&&(cf==='all'||x.course?.course_id===cf)),hidden=raw.plan?.current?.lanes?.[k]?.hidden||0;
      return `<section class="lane"><h2>${name}<small>${desc}</small></h2><div class="card list"><div class="list-head"><span class="muted">${xs.length} shown${hidden?` · ${hidden} more not shown by the server`:''}</span></div>${xs.length?xs.map(it=>{const st=status(it);
        return `<div class="row"><span class="rank">${it.rank??'–'}</span><div><div class="t">${esc(it.what)}</div><div class="m">${[it.course?it.course.code+' · '+it.course.name:null,it.chapter].filter(Boolean).map(esc).join(' · ')}</div>${it.why&&it.why!==it.what?`<details class="why"><summary>Why ranked</summary><p>${esc(it.why)}</p></details>`:''}</div>${st!=='upcoming'?`<span class="tag">${esc(st)}</span>`:k==='setup'?'':`<span class="tag">${it.mins==null?'time unknown':it.mins+' min'}</span>`}</div>`}).join(''):'<p class="empty">Nothing in this lane right now.</p>'}</div></section>`;
}
// D-302: his own tasks, filtered by the same chip, with no rank; ticking stays on Today
function personalLane(own,cf){
  const xs=own.filter(x=>cf==='all'||x.course?.course_id===cf);
  return `<section class="lane"><h2>Personal<small>Tasks you added on Today. Not ranked.</small></h2><div class="card list"><div class="list-head"><span class="muted">${xs.length} shown</span></div>${xs.length?xs.map(it=>
    `<div class="row ${isDone(it)?'done':''}"><span class="rank">•</span><div><div class="t">${esc(it.what)}</div><div class="m">${it.course?esc(it.course.code+' · '+it.course.name):'No course'}</div></div>${isDone(it)?'<span class="tag">done</span>':''}</div>`).join('')
    :`<p class="empty">${cf==='all'?'No personal tasks. Add one on Today.':'No personal tasks for this course.'}</p>`}</div></section>`;

// ---- Schedule: the week's classes
function schedulePage(){
  const sem=raw.semester||{},left=sem.end?daysTo(sem.end):null,head=`<div class="eyebrow">Class timetable${sem.name?' · '+esc(sem.name):''} · ${left==null?'semester end unknown':Math.max(0,left)+' days to semester end'}</div><h1>Schedule</h1>`;
  const min=t=>{const [h,m]=String(t||'').split(':').map(Number);return (h||0)*60+(m||0)},usable=meetings.filter(m=>m.start&&m.end&&m.weekday>=1&&m.weekday<=5);
  if(!meetings.length)return head+'<p class="empty">The timetable has no meetings entered.</p>';
  if(!usable.length)return head+'<p class="empty">Meeting times are not available.</p>';
  const base=Math.floor(Math.min(...usable.map(m=>min(m.start)))/60),hrs=Math.max(4,Math.ceil(Math.max(...usable.map(m=>min(m.end)))/60)-base),wdNow=new Date().getDay()||7,now=new Date().getHours()*60+new Date().getMinutes();
  // meetings that touch in time form one group; each takes the first free lane, and the group shares one width
  const place=xs=>{let group=[],end=-1;const out=[],close=()=>{const n=Math.max(...group.map(g=>g.lane))+1;group.forEach(g=>out.push({...g,n}));group=[]};
    [...xs].sort((a,b)=>min(a.start)-min(b.start)||min(a.end)-min(b.end)).forEach(m=>{if(group.length&&min(m.start)>=end){close();end=-1}const used=group.filter(g=>min(g.m.end)>min(m.start)).map(g=>g.lane);let lane=0;while(used.includes(lane))lane++;group.push({m,lane});end=Math.max(end,min(m.end))});
    if(group.length)close();return out};
  let h=`<div></div>${['Monday','Tuesday','Wednesday','Thursday','Friday'].map((d,i)=>`<div class="dh ${i+1===wdNow?'today':''}">${d}</div>`).join('')}<div class="hours" style="--hrs:${hrs}">${Array.from({length:hrs+1},(_,i)=>`<span style="top:${i*56}px">${pad(base+i)}:00</span>`).join('')}</div>`;
  for(let wd=1;wd<=5;wd++){
    const line=wd===wdNow&&now>=base*60&&now<=(base+hrs)*60?`<i class="nowline" style="top:${(now-base*60)/60*56}px"></i>`:'';
    h+=`<div class="day" style="--hrs:${hrs}">${place(usable.filter(m=>m.weekday===wd)).map(({m,lane,n})=>{const c=courses.find(c=>c.course_id===m.course_id);
      return `<div class="blk" style="--h:${hue(c)};top:${(min(m.start)-base*60)/60*56}px;height:${Math.max(30,(min(m.end)-min(m.start))/60*56-3)}px;left:calc(${lane/n*100}% + 3px);width:calc(${100/n}% - 6px)" title="${esc(c?.name||'')}"><b>${esc(m.code||c?.code||'Class')}</b><span>${esc(m.start)}–${esc(m.end)}${m.room?' · '+esc(m.room):''}</span></div>`}).join('')}${line}</div>`;
  }
  return head+`<div class="card list" style="margin-top:32px"><div class="gridwrap"><div class="grid">${h}</div></div></div>`;
}

// ---- drawing
function nav(){const s=$('#seg'),p=page();s.querySelectorAll('a').forEach(a=>a.dataset.p===p?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));const on=s.querySelector('[aria-current]');s.style.setProperty('--x',on.offsetLeft+'px');s.style.setProperty('--w',on.offsetWidth+'px')}
let shown=null;
function notice(){
  const asking=session&&!busy&&elapsed()>=ASK_AT&&elapsed()<EXPIRED_AT;
  document.title=asking?'Still studying? · Studysystem':'Studysystem';  // seen from another browser tab
  if(!asking)return '';
  return `<div class="notice"><b>Still studying?</b><div class="acts"><button class="btn" type="button" data-act="continue">Continue</button><button class="btn stop" type="button" data-act="stop">Stop</button></div><p>${esc(session.code)} · ${esc(hm(Math.floor(elapsed()/60)))} so far. At 3h55m this session stops and logs itself.</p></div>`;
}
// The notice is put in once, then only its minutes line changes, so it does not drop in again.
function paintNotice(){
  const n=notice(),box=$('#notice');if(box.dataset.html===n)return;
  const old=box.querySelector('.notice p');
  if(n&&old){const fresh=document.createElement('div');fresh.innerHTML=n;old.replaceWith(fresh.querySelector('p'))}
  else box.innerHTML=n;
  box.dataset.html=n;
}
function draw(){
  nav();paintNotice();$('#barDate').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  if(!raw)return;
  const p=page(),key=p+'?'+(param('course')||''),app=$('#app'),at=document.activeElement?.dataset,keep=at&&(at.act==='done'||at.act==='paper')?[at.act,at.id]:null;
  app.innerHTML=`<div class="${shown===key?'':'page'}">${p==='plan'?planPage():p==='schedule'?schedulePage():todayPage()}</div>`;shown=key;
  if(keep)[...app.querySelectorAll(`[data-act="${keep[0]}"]`)].find(b=>b.dataset.id===keep[1])?.focus(); // a tick keeps the keyboard's place
  if(first){first=false;setTimeout(()=>{const r=$('#ringfill');if(r)r.style.strokeDashoffset=r.dataset.to;$('#seg').classList.add('live')},80)}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const {act,id}=b.dataset;
  if(act==='theme'){const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches,t=dark?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('semcon.theme',t)}catch(x){}return}
  if(act==='goal'){goalEdit={...GOAL_CLOSED,open:true};draw();$('#goal input')?.select();return}
  if(act==='goal-cancel'){goalEdit={...GOAL_CLOSED};draw();return}
  if(act==='fold-tasks'){store.tasksFolded=!store.tasksFolded;saveStore();draw();$('[data-act="fold-tasks"]')?.focus();return}
  if(act==='menu')return menu(id,openMenu()!==id);
  if(act==='wtab'){store.watchTab=id;saveStore();draw();$('[data-act="wtab"][aria-selected="true"]')?.focus();return}
  if(act==='pick'){const which=b.dataset.menu;if(which==='logCourse')logDraft.code=id;else{store[which]=id;saveStore()}if(which==='course'||which==='mode')note=null;draw();$('#'+which+'Btn')?.focus();return}
  if(act==='start')return start();
  if(act==='stop')return stop();
  if(act==='continue')return stop('continue');
  if(act==='paper'){e.preventDefault();const f=b.closest('details')?.dataset.fold;if(f)openFolds.add(f);store.papers[id]?delete store.papers[id]:store.papers[id]=true;saveStore();draw();return}
  if(act==='done'||act==='skip'){
    if(id.startsWith('custom:')){const t=store.custom.find(x=>x.id===id.slice(7));if(t){if(act==='skip')store.custom=store.custom.filter(x=>x!==t);else{t.done=!t.done;t.doneDay=TODAY}}}
    else store.items[id]={status:act==='skip'?'skipped':status({uid:id})==='done'?'upcoming':'done'};
    saveStore();draw();
  }
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu'))menu(null,false)});
document.addEventListener('keydown',e=>{
  if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&e.target.matches?.('[role="tab"]')){const t=[...e.target.parentNode.querySelectorAll('[role="tab"]')];t[(t.indexOf(e.target)+(e.key==='ArrowRight'?1:t.length-1))%t.length].click();return}
  const name=openMenu();if(!name)return;const p=$('#'+name+'Pop');
  const os=[...p.querySelectorAll('.opt')],i=os.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();os[Math.min(os.length-1,i+1)].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();os[Math.max(0,i-1)].focus()}
  else if(e.key==='Escape'){menu(null,false);$('#'+name+'Btn')?.focus()}
});
document.addEventListener('toggle',e=>{const id=e.target.dataset?.fold;if(id)e.target.open?openFolds.add(id):openFolds.delete(id)},true);
document.addEventListener('input',e=>{if(e.target.closest('#logform')&&e.target.name in logDraft){logDraft[e.target.name]=e.target.value;logDraft.msg=null}if(e.target.closest('#goal'))goalEdit.draft=e.target.value;if(e.target.closest('#add'))taskDraft=e.target.value}); // a redraw keeps what he typed
document.addEventListener('submit',e=>{if(e.target.id==='logform'){e.preventDefault();logHours(e.target);return}
  if(e.target.id==='goal'){e.preventDefault();if(!goalEdit.busy)saveGoal(Number(new FormData(e.target).get('hours')));return}
  if(e.target.id!=='add')return;e.preventDefault();const title=String(new FormData(e.target).get('title')||'').trim(),course=taskCourse()?.code||null;if(!title)return;taskDraft='';store.custom.unshift({id:Math.random().toString(36).slice(2),title,course,mins:null,done:false});saveStore();draw();$('#add input')?.focus()});
addEventListener('hashchange',()=>{draw();scrollTo({top:0})});
addEventListener('resize',nav);

async function load(){const r=await fetch("/state",{headers:{Accept:'application/json'}});if(!r.ok)throw Error('The state request failed');adapt(await r.json());draw()}
nav();
load().catch(e=>{$('#app').innerHTML=`<p class="empty">${esc(e instanceof TypeError?'The dashboard server is not running':e.message)}. Start it, then reload this page.</p>`});
</script>
</body>
</html>
