  $("#nav").innerHTML = SECTIONS.map(g => `
    <div class="nav-group"><div class="nav-title">${g.group}</div>
      ${g.items.map(s => `<a class="nav" href="#/${s.id}" ${active === s.id ? 'aria-current="page"' : ""}>${ic(s.icon)}<span class="n-label">${s.label}</span>${s.badge ? `<span class="n-badge">${s.badge()}</span>` : ""}</a>`).join("")}
    </div>`).join("") + `
    <div class="nav-group"><div class="nav-title">Courses</div>
      ${DATA.courses.map(c => `<a class="cnav" href="${courseHref(c)}" ${active === "c/" + c.id ? 'aria-current="page"' : ""}>
        <span class="swatch" style="background:${c.color}"></span><span class="code">${esc(c.code)}</span>
        <span class="ct">${courseCount(c)}</span></a>`).join("")}
    </div>`;
}

/* the phone bar holds six slots; the pages that do not fit sit behind "More" */
const MOBMORE = [
  { id: "grades", label: "Grades", icon: "grades" },
  { id: "load", label: "Workload", icon: "workload" },
  { id: "attention", label: "Insights", icon: "insights" }
];
function renderMobnav(active) {
  const inMore = MOBMORE.some(m => m.id === active);
  $("#mobnav").innerHTML = MOBNAV.map(s => `<a class="mnav" href="#/${s.id}" ${active === s.id ? 'aria-current="page"' : ""}>${ic(s.icon)}<span>${s.label}</span></a>`).join("") + `
    <button class="mnav" id="mobMore" type="button" aria-haspopup="true" aria-expanded="false" ${inMore ? 'aria-current="page"' : ""}>${ic("more")}<span>More</span></button>
    <div class="mobmore" id="mobMoreSheet" hidden>${MOBMORE.map(m => `<a href="#/${m.id}" ${active === m.id ? 'aria-current="page"' : ""}>${ic(m.icon)}<span>${m.label}</span></a>`).join("")}</div>`;
}

const semCaption = () => SEM.pct != null ? `${SEM.pct}% · wk ${SEM.week}/${SEM.weeks}`
  : SEM.daysLeft != null ? `${SEM.daysLeft} days to finals` : "dates not set";

function renderTopbar(active) {
  const now = new Date(); const h = now.getHours();
  const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const dateStr = TODAY.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  const semBar = `<div class="bar"><i style="width:${SEM.pct != null ? SEM.pct : 6}%"></i></div><span class="cap num">${semCaption()}</span>`;
  $("#topbar").innerHTML = `
    <div class="greet">
      ${active === "overview" ? `<h2>${greet}</h2>` : ""}
      <div class="meta">${esc(dateStr)} · <b>${esc(DATA.semester.name)}</b></div>
    </div>
    <div class="head-right">
      <div class="searchbox">${ICON.search}<input class="field" id="search" placeholder="Jump to…" aria-label="Search" autocomplete="off"></div>
      <div class="semprog"><span class="eyebrow">Semester</span>${semBar}</div>
      <button class="btn-icon btn-secondary" id="themeBtn" aria-label="Toggle theme"></button>
    </div>`;
  updateThemeIcons();
  const s = $("#search");
  if (s) s.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const v = e.target.value.trim().toLowerCase(); if (!v) return;
    const c = DATA.courses.find(c => c.code.toLowerCase().includes(v) || c.name.toLowerCase().includes(v));
    if (c) location.hash = courseHref(c);
    else { const p = ["overview","queue","calendar","schedule","courses","grades","load","attention"].find(x => x.includes(v)); location.hash = "#/" + (p || "queue"); }
    e.target.value = "";
  });
}

function applyTheme() {
  const t = STATE.theme;
  if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  else if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  DATA.courses.forEach(c => { c.color = cssVar(c.colorVar); });
}
function updateThemeIcons() {
  const t = STATE.theme;
  const svg = t === "dark" ? ICON.moon : t === "light" ? ICON.sun : ICON.auto;
  const lbl = "Theme: " + (t === "system" ? "auto" : t);
  const b = $("#themeBtn"), m = $("#themeMob");
  if (b) { b.innerHTML = svg; b.setAttribute("aria-label", lbl); }
  if (m) { m.innerHTML = svg; m.setAttribute("aria-label", lbl); }
}
function cycleTheme() {
  STATE.theme = STATE.theme === "system" ? "light" : STATE.theme === "light" ? "dark" : "system";
  persist(); applyTheme(); refresh();
}

/* ============================================================
   ROUTER + WIRING
   ============================================================ */
function pageFor(raw) {
  if (raw.startsWith("c/")) {
    const code = decodeURIComponent(raw.slice(2));
    const c = DATA.courses.find(x => x.id === code);
    return c ? { html: PAGES.course(c), active: "c/" + c.id } : { html: PAGES.overview(), active: "overview" };
  }
  if (PAGES[raw]) return { html: PAGES[raw](), active: raw };
  return { html: PAGES.overview(), active: "overview" };
}

function render(preserveScroll) {
  const raw = (location.hash || "#/overview").replace(/^#\/?/, "") || "overview";
  const { html, active } = pageFor(raw);
  $("#view").innerHTML = html + `<footer class="foot">Read from the study server (<code>GET /state</code>, generated ${esc(DATA.generatedAt)}). Unknown stays unknown, and a panel the server has no numbers for says so. This page never invents what the server does not know.</footer>`;
  renderNav(active); renderMobnav(active); renderTopbar(active);
  $("#brandSub").textContent = SEM.week ? `Week ${SEM.week} of ${SEM.weeks}` : SEM.daysLeft != null ? `${SEM.daysLeft} days to finals` : "Semester dates not set";
  wire(raw);
  if (!preserveScroll) window.scrollTo({ top: 0, behavior: "instant" });
}
function route() { render(false); }
function refresh() { render(true); renderPill(); }

function wire(page) {
  document.querySelectorAll("[data-projector]").forEach(box => { runProjector(box); box.addEventListener("input", () => runProjector(box)); });

  const af = $("#addForm");
  if (af) af.addEventListener("submit", e => {
    e.preventDefault();
    addCustom($("#addTitle").value, $("#addCourse") ? $("#addCourse").value : "", +($("#addMins") ? $("#addMins").value : CUSTOM_MINS));
  });

  if (page === "schedule" && DATA.meetings) {
    const body = $("#skBody");
    if ($("#skKind")) $("#skKind").addEventListener("click", e => {
      const b = e.target.closest("[data-kind]"); if (!b) return;
      SK.kind = b.dataset.kind;
      document.querySelectorAll("#skKind .chip").forEach(x => x.setAttribute("aria-pressed", x === b));
      body.innerHTML = skBody();
    });
    body.addEventListener("click", e => {
      const b = e.target.closest("[data-day]"); if (!b) return;
      SK.day = +b.dataset.day; body.innerHTML = skBody();
    });
  }

  if (page === "queue") {
    let kind = "all", showDone = false;
    /* grouped by lane, in lane order (D-191) */
    const group = lane => {
      const all = laneItems(lane), items = showDone ? all : all.filter(isOpen);
      const first = (focusItem() || {}).uid;
      return `<div class="section lane-${lane}" data-lane="${lane}">
        <div class="sec-head"><h3 class="lane-h">${ic(LANE_ICON[lane])}${LANE_TITLE[lane]}</h3><span class="eyebrow">${esc(laneCount(lane))}</span></div>
        ${items.length ? `<div class="tasklist">${items.map(x => taskCard(x, x.uid === first)).join("")}</div>`
          : `<p class="none">${all.length ? "All cleared." : LANE_EMPTY[lane]}</p>`}
      </div>`;
    };
    const draw = () => {
      $("#qList").innerHTML = DATA.plan ? (kind === "all" ? LANES : [kind]).map(group).join("")
        : `<p class="none">No plan yet. Ask the host to run <code>study_get_plan</code>.</p>`;
      const open = planItems().filter(isOpen).length;
      $("#qCount").textContent = `From the plan · ${open} open`;
      $("#qStrap").textContent = planAgeLabel();
    };
    $("#qFilter").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; kind = b.dataset.kind; [...$("#qFilter").children].forEach(ch => ch.setAttribute("aria-pressed", String(ch === b))); draw(); });
    $("#showDone").addEventListener("change", e => { showDone = e.target.checked; draw(); });
    draw();
  }

  if (page === "grades") {
    const s = $("#semAssume");
    const draw = () => {
      const a = +s.value; $("#semAssumeOut").textContent = a + "%";
      // Only a course with credits, marks and known weights can enter the average: the
      // other cells read unknown, and the average is over the same courses on both sides.
      let now = 0, then = 0, credits = 0;
      $("#semProjRows").innerHTML = DATA.courses.map(c => {
        const lands = c.weightsKnown ? c.earned + c.openWeight * a / 100 : null;
        const delta = lands == null || c.standing == null ? null : lands - c.standing;
        if (delta != null && c.credits != null) { now += c.standing * c.credits; then += lands * c.credits; credits += c.credits; }
        const tone = delta == null ? "var(--ink-3)" : delta < -0.05 ? "var(--critical)" : delta > 0.05 ? "var(--ink)" : "var(--ink-3)";
        return `<tr><td><span class="swatch" style="background:${c.color}"></span> ${esc(c.code)}</td><td class="muted">${num(c.standing, 1)}</td><td><b>${num(lands, 1)}</b></td><td style="color:${tone}">${delta == null ? "-" : (delta >= 0 ? "+" : "") + delta.toFixed(1)}</td></tr>`;
      }).join("");
      if (!credits) { $("#semNow").textContent = $("#semThen").textContent = $("#semDelta").textContent = "-"; return; }
      const nowAvg = now / credits, thenAvg = then / credits;
      $("#semNow").textContent = nowAvg.toFixed(1); $("#semThen").textContent = thenAvg.toFixed(1);
      $("#semDelta").textContent = (thenAvg - nowAvg >= 0 ? "+" : "") + (thenAvg - nowAvg).toFixed(1);
    };
    s.addEventListener("input", draw); draw();
  }
}

/* delegated actions (attached once) */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-action]"); if (a) {
    const act = a.dataset.action, uid = a.dataset.uid;
    if (act === "start") { startSession(uid); return; }
    if (act === "toggle") { toggleItem(uid); return; }
    if (act === "skip") { skipItem(uid); return; }
    if (act === "del") { deleteCustom(uid.replace(/^custom:/, "")); return; }
    if (act === "clearcustom") { clearDoneCustom(); return; }
  }
  const sx = e.target.closest("[data-sx]"); if (sx) {
    const k = sx.dataset.sx;
    if (k === "pause") togglePause();
    else if (k === "done") closeSession(true);
    else if (k === "skip") { const uid = SESSION && SESSION.uid; closeSession(false); if (uid) skipItem(uid); }
    else if (k === "min") hideSession();
    else if (k === "begin") beginSession();
    return;
  }
  const md = e.target.closest("[data-mode]"); if (md) { setMode(md.dataset.mode); return; }
});
$("#themeMob").addEventListener("click", cycleTheme);
document.addEventListener("click", e => {
  const sheet = $("#mobMoreSheet"), btn = e.target.closest("#mobMore");
  if (!sheet) return;
  if (btn) { sheet.hidden = !sheet.hidden; btn.setAttribute("aria-expanded", String(!sheet.hidden)); }
  else if (!sheet.hidden && !e.target.closest("#mobMoreSheet")) sheet.hidden = true;
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (SESSION && $("#scrim")) hideSession(); }
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (!STATE) return;
  if (e.key === "t" || e.key === "T") cycleTheme();
});

/* theme button lives in topbar (re-rendered), so delegate its click */
document.addEventListener("click", e => { if (STATE && e.target.closest("#themeBtn")) cycleTheme(); });

/* ============================================================
   REFRESH - a plan or class the host adds while this tab is open appears when you come back to
   it. Skipped while a session modal is open or a field has focus, so nothing you are typing goes.
   ============================================================ */
let lastLoad = Date.now(), reloading = false;
/* fetch /state and redraw; false when the server answered with an error */
async function loadState() {
  const response = await fetch("/state", { headers: { Accept: "application/json" } });
  if (!response.ok) return false;
  DATA = adapt(await response.json());
  applyTheme(); derive(); lastLoad = Date.now(); refresh();
  return true;
}
async function reloadState() {
  if (reloading || !DATA || document.hidden || Date.now() - lastLoad < 10000) return;
  if (SESSION || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if ([...document.querySelectorAll("#view input.field, #view textarea")].some(el => el.value)) return;   /* text typed, then clicked away */
  reloading = true;
  try { await loadState(); }
  catch (err) { /* the server is away: keep what is drawn */ } finally { reloading = false; }
}
/* accepting the timetable's suggestion writes a new capacity row (D-216); the old ones stay */
document.addEventListener("submit", async e => {
  if (e.target.id !== "acceptCap") return;
  e.preventDefault();
  const msg = $("#acceptMsg"), btn = e.target.querySelector("button");
  btn.disabled = true; msg.textContent = "";
  try {
    await post("/capacity/accept", { suggestion_id: DATA.capacitySuggestionId, from_date: $("#acceptFrom").value });
    if (!(await loadState())) msg.textContent = "Saved. Reload the page to see it.";
  } catch (err) { msg.textContent = errorText(err); btn.disabled = false; }
});
document.addEventListener("visibilitychange", reloadState);
window.addEventListener("focus", reloadState);

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  try {
    const response = await fetch("/state", { headers: { Accept: "application/json" } });
    const body = await response.json();
    if (!response.ok) throw new Error(body.message || "the server answered " + response.status);
    DATA = adapt(body);
  } catch (err) {
    $("#view").innerHTML = `<section class="card"><div class="card-head"><h3>The study server did not give a state</h3></div>
      <div class="pad"><p>${esc(err.message)}</p><p class="none">Start it with <code>uv run study dashboard</code> and reload this page.</p></div></section>`;
    return;
  }
  TODAY = d(DATA.semester.today);
  initState();
  applyTheme();
  derive();
  lastLoad = Date.now();
  window.addEventListener("hashchange", route);
  route();
}
boot();

/* ---- collapsible rail (D-207): the choice is kept; the mouse entering a collapsed rail widens it ---- */
(function rail() {
  const app = $(".app"), r = $(".rail"), btn = $("#railToggle"); let leave = null;
  const set = collapsed => {
    app.classList.toggle("collapsed", collapsed);
    if (collapsed) app.classList.remove("peek");   /* the pointer is still on the button: do not re-open */
    btn.setAttribute("aria-expanded", String(!collapsed));
    btn.setAttribute("aria-label", collapsed ? "Expand sidebar" : "Collapse sidebar");
    try { localStorage.setItem("studysystem.rail", collapsed ? "1" : "0"); } catch (e) { /* storage blocked: stays per visit */ }
  };
  btn.addEventListener("click", () => set(!app.classList.contains("collapsed")));
  r.addEventListener("mouseenter", () => { clearTimeout(leave); app.classList.add("peek"); });
  r.addEventListener("mouseleave", () => { leave = setTimeout(() => app.classList.remove("peek"), 120); });
  r.addEventListener("focusin", () => app.classList.add("peek"));
  r.addEventListener("focusout", e => { if (!r.contains(e.relatedTarget)) app.classList.remove("peek"); });
  try { if (localStorage.getItem("studysystem.rail") === "1") set(true); } catch (e) { /* storage blocked */ }
})();

/* ---- tooltip ---- */
(function tooltip() {
  const tip = $("#tip"); let raf = null;
  document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (!t) return; tip.innerHTML = t.dataset.tip.split("\n").map(esc).join("<br>"); tip.classList.add("on"); });
  document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) tip.classList.remove("on"); });
  document.addEventListener("mousemove", e => {
    if (!tip.classList.contains("on") || raf) return;
    raf = requestAnimationFrame(() => { raf = null; const pad = 14, r = tip.getBoundingClientRect(); let x = e.clientX + pad, y = e.clientY + pad; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad; tip.style.left = x + "px"; tip.style.top = y + "px"; });
  });
})();

</script>
