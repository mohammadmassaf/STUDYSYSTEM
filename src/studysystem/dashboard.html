<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semester Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">

<style>
/* ============================================================
   1 · DESIGN TOKENS - light is the base; dark redefines tokens.
   Palette (D-207, D-230, D-231): cyan accent, cool light grounds, pure black in dark; one role per colour.
   Series + confidence colours are the validated dataviz ramps.
   ============================================================ */
:root {
  color-scheme: light;
  /* grounds & surfaces - cool near-white, faint cyan cast */
  --bg:#F4F6F7; --paper:#F4F6F7;
  --surface:#FFFFFF; --card:#FFFFFF;
  --surface-2:#E9EEF0; --sunken:#E9EEF0;
  --raise:#FFFFFF;
  --rule:#DDE3E6; --rule-soft:#E8ECEE; --rule-strong:#C3CCD1;
  /* ink - deep slate on light */
  --ink:#17141F; --ink-2:#463F55; --ink-3:#645D74; --ink-4:#958EA4;
  /* accent - cyan, deepened for readability on white (cyan-600) */
  --accent:#0891B2; --accent-strong:#0E7490;
  --accent-ink:#FFFFFF; --accent-wash:rgba(8,145,178,0.10); --accent-line:rgba(8,145,178,0.28);
  /* course colours (8): one lightness and strength in OKLCH (L .56 C .096 light, L .78 C .114 dark), hues spread */
  --k1:#4C76AC; --k2:#7D772D; --k3:#9E5C7C; --k4:#048681; --k5:#6F6CAB; --k6:#55824B; --k7:#8A639B; --k8:#A36143;
  /* status - spaced hues so none blur together on white; always paired with icon+label */
  --good:#047857; --good-wash:rgba(4,120,87,0.12);
  --warn:#946412; --warn-wash:rgba(148,100,18,0.14);
  --serious:#C2410C; --serious-wash:rgba(194,65,12,0.12);
  --critical:#BE123C; --critical-wash:rgba(190,18,60,0.10);
  --done:#5A6B73; --done-wash:rgba(90,107,115,0.12);
  --c0-line:#C3CCD1; --lost:#DDE3E6;
  /* radius scale */
  --r1:8px; --r2:12px; --r3:16px; --rpill:999px;
  /* elevation - cool shadows */
  --sh-1:0 1px 2px rgba(23,20,31,.05);
  --sh-2:0 2px 6px -2px rgba(23,20,31,.10), 0 8px 24px -14px rgba(23,20,31,.20);
  --sh-3:0 12px 40px -12px rgba(23,20,31,.28);
  --shadow:var(--sh-2);
  /* type */
  --f-display:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ui:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#000000; --paper:#000000;
    --surface:#0E0E10; --card:#0E0E10;
    --surface-2:#1A1A1D; --sunken:#1A1A1D;
    --raise:#1A1A1D;
    --rule:#232326; --rule-soft:#18181B; --rule-strong:#35353A;
    --ink:#F2F2F3; --ink-2:#C8C8CC; --ink-3:#9A9AA0; --ink-4:#6E6E75;
    --accent:#22D3EE; --accent-strong:#67E8F9;
    --accent-ink:#000000; --accent-wash:rgba(34,211,238,0.16); --accent-line:rgba(34,211,238,0.34);
    --k1:#85BAFF; --k2:#C2BC60; --k3:#EF99C2; --k4:#4ACFC7; --k5:#B0ADFE; --k6:#90C983; --k7:#D3A1EA; --k8:#F49F79;
    --good:#34D399; --good-wash:rgba(52,211,153,0.15);
    --warn:#FBBF24; --warn-wash:rgba(251,191,36,0.15);
    --serious:#FB923C; --serious-wash:rgba(251,146,60,0.16);
    --critical:#FB7185; --critical-wash:rgba(251,113,133,0.15);
    --done:#94A3B8; --done-wash:rgba(148,163,184,0.16);
    --c0-line:#35353A; --lost:#232326;
    --sh-1:0 1px 2px rgba(0,0,0,.55);
    --sh-2:0 2px 8px -2px rgba(0,0,0,.6), 0 10px 30px -16px rgba(0,0,0,.85);
    --sh-3:0 16px 48px -12px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:#000000; --paper:#000000;
  --surface:#0E0E10; --card:#0E0E10;
  --surface-2:#1A1A1D; --sunken:#1A1A1D;
  --raise:#1A1A1D;
  --rule:#232326; --rule-soft:#18181B; --rule-strong:#35353A;
  --ink:#F2F2F3; --ink-2:#C8C8CC; --ink-3:#9A9AA0; --ink-4:#6E6E75;
  --accent:#22D3EE; --accent-strong:#67E8F9;
  --accent-ink:#000000; --accent-wash:rgba(34,211,238,0.16); --accent-line:rgba(34,211,238,0.34);
  --k1:#85BAFF; --k2:#C2BC60; --k3:#EF99C2; --k4:#4ACFC7; --k5:#B0ADFE; --k6:#90C983; --k7:#D3A1EA; --k8:#F49F79;
  --good:#34D399; --good-wash:rgba(52,211,153,0.15);
  --warn:#FBBF24; --warn-wash:rgba(251,191,36,0.15);
  --serious:#FB923C; --serious-wash:rgba(251,146,60,0.16);
  --critical:#FB7185; --critical-wash:rgba(251,113,133,0.15);
  --done:#94A3B8; --done-wash:rgba(148,163,184,0.16);
  --c0-line:#35353A; --lost:#232326;
  --sh-1:0 1px 2px rgba(0,0,0,.55);
  --sh-2:0 2px 8px -2px rgba(0,0,0,.6), 0 10px 30px -16px rgba(0,0,0,.85);
  --sh-3:0 16px 48px -12px rgba(0,0,0,.9);
}

/* ============================================================
   2 · BASE
   ============================================================ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
::selection { background:var(--accent-wash); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
[hidden] { display:none !important; }
svg { display:block; }

/* ============================================================
   3 · TYPOGRAPHY HELPERS
   ============================================================ */
.eyebrow { font-family:var(--f-data); font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-3); font-weight:500; }
.serif { font-family:var(--f-display); }
.num { font-family:var(--f-data); font-variant-numeric:tabular-nums; }
.muted { color:var(--ink-3); }
.unknown { color:var(--ink-3); font-style:italic; }

/* ============================================================
   4 · LAYOUT
   ============================================================ */
.app {
  max-width:1440px; margin:0 auto; min-height:100vh;
  display:grid; grid-template-columns:256px minmax(0,1fr);
  align-items:start;
}
.rail {
  position:sticky; top:0; height:100vh; overflow-y:auto;
  padding:22px 16px; display:flex; flex-direction:column; gap:22px;
  border-right:1px solid var(--rule-soft);
}
.content { min-width:0; padding:0 28px 96px; }
.topbar {
  position:sticky; top:0; z-index:20;
  padding:20px 0 16px; margin-bottom:8px;
  background:linear-gradient(var(--bg) 78%, transparent);
  display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
main#view { display:flex; flex-direction:column; gap:22px; min-width:0; }
.section { display:flex; flex-direction:column; gap:14px; min-width:0; }
.stack { display:flex; flex-direction:column; gap:22px; min-width:0; }
.split { display:grid; grid-template-columns:1.15fr .85fr; gap:22px; align-items:start; min-width:0; }
.split.even { grid-template-columns:1fr 1fr; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.spread { display:flex; align-items:center; justify-content:space-between; gap:14px; }
.sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; }
.sec-head h2 { font-family:var(--f-display); font-weight:600; font-size:20px; margin:0; letter-spacing:-.01em; }
.grow { flex:1; min-width:0; }

/* ============================================================
   5 · NAVIGATION
   ============================================================ */
.brand { padding:2px 8px; display:flex; align-items:center; gap:11px; }
.brand .mark {
  width:34px; height:34px; border-radius:9px; flex:none;
  background:var(--surface-2); color:var(--ink); font:700 17px/1 var(--f-display);
  display:grid; place-items:center;
}
.brand h1 { font-family:var(--f-display); font-weight:600; font-size:18px; margin:0; letter-spacing:-.01em; line-height:1.1; }
.brand .sub { font-size:11px; color:var(--ink-3); }

nav.rail-nav { display:flex; flex-direction:column; gap:16px; }
.nav-group { display:flex; flex-direction:column; gap:2px; }
.nav-title { font-family:var(--f-data); font-size:9.5px; text-transform:uppercase; letter-spacing:.15em; color:var(--ink-4); padding:2px 10px 6px; }
a.nav {
  position:relative; display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:var(--r1);
  color:var(--ink-2); text-decoration:none; font-size:14px; font-weight:500;
  transition:background .14s ease, color .14s ease;
}
a.nav .ic { color:var(--ink-3); flex:none; transition:color .14s ease; }
a.nav .ic svg { width:17px; height:17px; }
a.nav:hover { background:var(--surface-2); color:var(--ink); }
a.nav:hover .ic { color:var(--ink-2); }
a.nav[aria-current="page"] { background:var(--accent-wash); color:var(--ink); font-weight:600; }
a.nav[aria-current="page"] .ic { color:var(--accent); }
a.nav[aria-current="page"]::before {
  content:""; position:absolute; left:-16px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; border-radius:0 3px 3px 0; background:var(--accent);
}
a.nav .n-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.n-badge {
  font-family:var(--f-data); font-size:10.5px; padding:1px 7px; border-radius:var(--rpill);
  background:var(--surface-2); color:var(--ink-2); font-variant-numeric:tabular-nums; min-width:20px; text-align:center;
}
a.nav[aria-current="page"] .n-badge { background:var(--accent); color:var(--accent-ink); }

/* course nav rows */
a.cnav { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--r1); text-decoration:none; color:var(--ink-2); font-size:13.5px; transition:background .14s ease; }
a.cnav:hover { background:var(--surface-2); color:var(--ink); }
a.cnav[aria-current="page"] { background:var(--accent-wash); color:var(--ink); }
a.cnav .swatch { width:9px; height:9px; border-radius:3px; flex:none; }
a.cnav .code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
a.cnav .hd { width:8px; height:8px; border-radius:50%; flex:none; }
a.cnav .ct { font-family:var(--f-data); font-size:10.5px; color:var(--ink-3); }

.rail-foot { margin-top:auto; padding:10px 8px 0; font-size:11px; color:var(--ink-4); border-top:1px solid var(--rule-soft); }

/* ============================================================
   6 · BUTTONS
   ============================================================ */
.btn {
  font-family:var(--f-ui); font-size:14px; font-weight:600; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:0 16px; height:40px; border-radius:var(--r1);
  border:1px solid transparent; cursor:pointer; white-space:nowrap;
  transition:background .14s ease, border-color .14s ease, transform .06s ease, box-shadow .14s ease;
  text-decoration:none;
}
.btn svg { width:16px; height:16px; }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--accent); color:var(--accent-ink); box-shadow:var(--sh-1); }
.btn-primary:hover { background:var(--accent-strong); }
.btn-secondary { background:var(--surface); color:var(--ink); border-color:var(--rule-strong); }
.btn-secondary:hover { background:var(--surface-2); border-color:var(--ink-3); }
.btn-ghost { background:transparent; color:var(--ink-2); padding:0 10px; }
.btn-ghost:hover { background:var(--surface-2); color:var(--ink); }
.btn-danger { background:transparent; color:var(--critical); border-color:transparent; }
.btn-danger:hover { background:var(--critical-wash); }
.btn-sm { height:32px; padding:0 12px; font-size:13px; border-radius:var(--r1); }
.btn-lg { height:46px; padding:0 22px; font-size:15px; }
.btn-icon { width:36px; height:36px; padding:0; border-radius:var(--r1); }
.btn-block { width:100%; }
.linkbtn { background:none; border:0; color:var(--accent); font:inherit; font-weight:600; font-size:13px; cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:4px; }
.linkbtn:hover { color:var(--accent-strong); }
.linkbtn svg { width:14px; height:14px; }

/* ============================================================
   7 · CARDS & SURFACES
   ============================================================ */
.card { min-width:0; background:var(--surface); border:1px solid var(--rule-soft); border-radius:var(--r2); box-shadow:var(--sh-1); }
.card.raise { box-shadow:var(--sh-2); }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 18px; border-bottom:1px solid var(--rule-soft); }
.card-head h3 { font-family:var(--f-display); font-weight:600; font-size:17px; margin:0; letter-spacing:-.005em; }
.card-head .tools { display:flex; gap:6px; align-items:center; }
.pad { padding:18px; }
.pad-sm { padding:14px 18px; }
.divide > * + * { border-top:1px solid var(--rule-soft); }
.strap { padding:12px 18px; font-size:12.5px; color:var(--ink-3); background:var(--surface-2); }
.strap.rt { border-radius:0 0 var(--r2) var(--r2); }
.strap a, .strap .linkbtn { font-size:12.5px; }
.flatsec { background:var(--surface-2); border-radius:var(--r2); padding:16px 18px; }

/* stat tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); }
.tile { padding:16px 18px; border-right:1px solid var(--rule-soft); }
.tile:last-child { border-right:0; }
.tile .v { font-family:var(--f-data); font-size:26px; font-weight:500; line-height:1.1; display:block; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.tile .v.sm { font-size:20px; }
.tile .k { font-size:12px; color:var(--ink-2); display:block; margin-top:4px; }
.tile .sub { font-size:11px; color:var(--ink-3); display:block; margin-top:3px; }

/* ============================================================
   8 · PILLS / BADGES / CHIPS
   ============================================================ */
.pill { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:var(--rpill); border:1px solid var(--rule); background:var(--surface); color:var(--ink-2); white-space:nowrap; }
.pill .dot { width:7px; height:7px; border-radius:50%; flex:none; }
.pill svg { width:13px; height:13px; }
.pill.ok { color:var(--good); background:var(--good-wash); border-color:transparent; }
.pill.watch { color:var(--warn); background:var(--warn-wash); border-color:transparent; }
.pill.slip { color:var(--serious); background:var(--serious-wash); border-color:transparent; }
.pill.risk { color:var(--critical); background:var(--critical-wash); border-color:transparent; }
.pill.ok .dot { background:var(--good); } .pill.watch .dot { background:var(--warn); }
.pill.slip .dot { background:var(--serious); } .pill.risk .dot { background:var(--critical); }
.pill.flag { border-style:dashed; color:var(--ink-3); }
.pill.plain { background:var(--surface-2); border-color:transparent; color:var(--ink-2); }
.tag { font-family:var(--f-data); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; padding:2px 7px; border-radius:5px; color:var(--ink-2); background:var(--surface-2); white-space:nowrap; }

.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip { font-family:var(--f-ui); font-size:12.5px; font-weight:600; padding:6px 13px; border-radius:var(--rpill); border:1px solid var(--rule); background:var(--surface); color:var(--ink-2); cursor:pointer; transition:border-color .14s, background .14s, color .14s; }
.chip:hover { border-color:var(--ink-3); color:var(--ink); }
.chip[aria-pressed="true"] { background:var(--accent-wash); border-color:var(--accent-line); color:var(--ink); }
.tbtn { font-family:var(--f-data); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; background:none; border:1px solid var(--rule); border-radius:var(--r1); padding:6px 11px; color:var(--ink-2); cursor:pointer; }
.tbtn:hover { border-color:var(--ink-3); color:var(--ink); }

/* ============================================================
   9 · DASHBOARD - Today's Focus hero
   ============================================================ */
.focus { position:relative; overflow:hidden; border-radius:var(--r3); border:1px solid var(--rule); box-shadow:var(--sh-2); background:var(--surface); }
.focus .accentbar { position:absolute; inset:0 auto 0 0; width:4px; }
.focus-in { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:26px; padding:24px 26px 24px 30px; align-items:end; }
.focus .lead { min-width:0; }
.focus .kicker { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.focus .kicker .eyebrow { color:var(--accent); }
.focus .course { display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:600; color:var(--ink-2); margin-bottom:6px; }
.focus .course .swatch { width:11px; height:11px; border-radius:4px; flex:none; }
.focus .task { font-family:var(--f-display); font-weight:600; font-size:29px; line-height:1.15; letter-spacing:-.015em; margin:0 0 14px; text-wrap:balance; }
.focus .facts { display:flex; gap:22px; flex-wrap:wrap; margin-bottom:16px; }
.focus .fact .fk { font-size:11px; color:var(--ink-3); display:block; margin-bottom:2px; }
.focus .fact .fv { font-size:14px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px; }
.focus .fact .fv .num { font-size:15px; }
.focus .why { background:var(--surface-2); border-radius:var(--r2); padding:13px 15px; font-size:13.5px; color:var(--ink-2); max-width:52ch; }
.focus .why b { color:var(--ink); }
.focus .why .eyebrow { display:block; margin-bottom:5px; }
.focus .cta { display:flex; flex-direction:column; gap:10px; align-items:stretch; min-width:190px; }
.focus .cta .exam { text-align:right; }
.focus .cta .exam .fk { font-size:11px; color:var(--ink-3); }
.focus .cta .exam .fv { font-family:var(--f-data); font-size:18px; font-weight:500; color:var(--ink); }
.focus.done .task { text-decoration:line-through; text-decoration-color:var(--ink-4); color:var(--ink-2); }

/* progress ring + daily progress */
.prog { display:grid; grid-template-columns:auto minmax(0,1fr); gap:20px; align-items:center; }
.ring { position:relative; width:96px; height:96px; flex:none; }
.ring svg { width:96px; height:96px; transform:rotate(-90deg); }
.ring .track { stroke:var(--surface-2); }
.ring .val { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1); }
.ring .mid { position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.ring .mid .p { font-family:var(--f-data); font-size:22px; font-weight:500; line-height:1; }
.ring .mid .l { font-size:9px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }
.prog-stats { display:flex; gap:22px; flex-wrap:wrap; }
.prog-stats .s .v { font-family:var(--f-data); font-size:19px; font-weight:500; display:block; font-variant-numeric:tabular-nums; }
.prog-stats .s .k { font-size:11px; color:var(--ink-3); }
.prog-bar { height:8px; border-radius:var(--rpill); background:var(--surface-2); overflow:hidden; margin-top:14px; }
.prog-bar > i { display:block; height:100%; border-radius:var(--rpill); background:var(--accent); transition:width .5s cubic-bezier(.4,0,.2,1); }

/* today's plan timeline */
.plan { list-style:none; margin:0; padding:0; }
.plan-row { display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:0 14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--rule-soft); transition:background .14s; }
.plan-row:last-child { border-bottom:0; }
.plan-row:hover { background:var(--surface-2); }
.plan-row .tick { width:22px; height:22px; border-radius:7px; border:1.5px solid var(--rule-strong); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none; transition:background .14s, border-color .14s; padding:0; }
.plan-row .tick svg { width:13px; height:13px; color:var(--surface); }
.plan-row .tick:hover { border-color:var(--accent); }
.plan-row .when { font-family:var(--f-data); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:44px; }
.plan-row .body { min-width:0; }
.plan-row .body .t { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.plan-row .body .m { font-size:12px; color:var(--ink-3); margin-top:2px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.plan-row .body .m .swatch { width:8px; height:8px; border-radius:3px; }
.plan-row .dur { font-family:var(--f-data); font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.plan-row .go { display:none; }
.plan-row:hover .go, .plan-row.active .go { display:inline-flex; }
.plan-row.done .tick { background:var(--accent); border-color:var(--accent); }
.plan-row.done .tick svg { color:var(--accent-ink); }
.plan-row.done .body .t { text-decoration:line-through; text-decoration-color:var(--ink-4); color:var(--ink-3); }
.plan-row.active { background:var(--accent-wash); }
.plan-row.active .when { color:var(--accent); }
.plan-row .live { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--accent); }
.plan-row .live .pulse { width:7px; height:7px; border-radius:50%; background:var(--accent); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
.plan-empty { padding:22px 18px; text-align:center; color:var(--ink-3); font-size:13.5px; }
/* the three lanes of D-15 (D-191) carry no colour of their own (D-231): heading, count and icon tell them apart */
.pill.lane { color:var(--ink-2); background:var(--surface-2); border-color:transparent; }
.pill.lane .dot { background:var(--ink-3); }
.lane-h { font-family:var(--f-display); font-weight:600; font-size:17px; margin:0; display:flex; align-items:center; gap:8px; }
.card.lane .card-head h3 { display:flex; align-items:center; gap:8px; }
.card.lane .card-head h3 .ic, .lane-h .ic { display:inline-flex; color:var(--ink-3); }
.card.lane .card-head h3 .ic svg, .lane-h .ic svg { width:17px; height:17px; }

/* add-task form */
.addbar { display:flex; gap:8px; align-items:center; padding:12px 18px; border-top:1px solid var(--rule-soft); flex-wrap:wrap; }
.addbar input.ti { flex:1; min-width:160px; }
.field { font-family:var(--f-ui); font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--rule-strong); border-radius:var(--r1); height:38px; padding:0 11px; transition:border-color .14s; }
.field:hover { border-color:var(--ink-3); }
.field:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
select.field { cursor:pointer; padding-right:26px; }
.field.mini { height:32px; font-size:13px; }

/* course health cards */
.health { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:16px; }
.hcard { display:flex; flex-direction:column; gap:12px; padding:18px; background:var(--surface); border:1px solid var(--rule-soft); border-radius:var(--r2); box-shadow:var(--sh-1); text-decoration:none; color:inherit; transition:box-shadow .16s, transform .1s, border-color .16s; position:relative; overflow:hidden; }
.hcard::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--cc,var(--accent)); opacity:.9; }
.hcard:hover { box-shadow:var(--sh-2); transform:translateY(-2px); border-color:var(--rule); }
.hcard:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.hcard .top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.hcard .name { font-family:var(--f-display); font-weight:600; font-size:16.5px; line-height:1.2; letter-spacing:-.005em; }
.hcard .code { font-family:var(--f-data); font-size:11px; color:var(--ink-3); margin-top:3px; }
.hcard .grade { text-align:right; font-family:var(--f-data); line-height:1.1; }
.hcard .grade .n { font-size:23px; font-weight:500; }
.hcard .grade .d { font-size:10px; color:var(--ink-3); display:block; letter-spacing:.03em; }
.hcard .cov { }
.hcard .cov .lab { display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin-bottom:5px; }
.hcard .meter { height:7px; border-radius:var(--rpill); background:var(--surface-2); overflow:hidden; }
.hcard .meter > i { display:block; height:100%; border-radius:var(--rpill); background:var(--cc,var(--accent)); }
.hcard .meter.striped > i { background:repeating-linear-gradient(135deg,var(--sunken),var(--sunken) 4px,var(--rule) 4px,var(--rule) 8px); }
.hcard .foot { display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:11px; border-top:1px solid var(--rule-soft); }
.hcard .exam { font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
.hcard .exam svg { width:13px; height:13px; color:var(--ink-3); }
.hcard .next { font-size:12px; color:var(--ink-2); }
.hcard .next .eyebrow { display:block; margin-bottom:2px; }

/* insights feed */
.feed { display:flex; flex-direction:column; }
.ins { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:14px 18px; border-bottom:1px solid var(--rule-soft); align-items:start; }
.ins:last-child { border-bottom:0; }
.ins .ic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none; }
.ins .ic svg { width:16px; height:16px; }
.ins.warn .ic { background:var(--warn-wash); color:var(--warn); }
.ins.risk .ic { background:var(--critical-wash); color:var(--critical); }
.ins.info .ic { background:var(--accent-wash); color:var(--accent); }
.ins.up .ic { background:var(--serious-wash); color:var(--serious); }
.ins.ok .ic { background:var(--good-wash); color:var(--good); }
.ins .h { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ins .d { font-size:13px; color:var(--ink-2); margin-top:2px; }

/* ============================================================
   10 · TASK QUEUE (actionable)
   ============================================================ */
.tasklist { display:flex; flex-direction:column; gap:12px; }
.task { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:0 15px; padding:15px 17px; background:var(--surface); border:1px solid var(--rule-soft); border-radius:var(--r2); box-shadow:var(--sh-1); align-items:center; transition:box-shadow .14s, border-color .14s; }
.task:hover { box-shadow:var(--sh-2); border-color:var(--rule); }
.task.done { opacity:.62; }
.task.done .tt { text-decoration:line-through; text-decoration-color:var(--ink-4); }
.task .tick { width:24px; height:24px; border-radius:8px; border:1.5px solid var(--rule-strong); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none; transition:background .14s, border-color .14s; padding:0; align-self:start; margin-top:2px; }
.task .tick svg { width:14px; height:14px; color:var(--surface); }
.task .tick:hover { border-color:var(--accent); }
.task.done .tick { background:var(--accent); border-color:var(--accent); }
.task.done .tick svg { color:var(--accent-ink); }
.task .mid { min-width:0; }
.task .tc { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2); font-weight:600; margin-bottom:3px; }
.task .tc .swatch { width:9px; height:9px; border-radius:3px; flex:none; }
.task .tt { font-weight:600; font-size:15px; line-height:1.3; }
.task .facts { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
.task .facts .f { font-size:11.5px; color:var(--ink-3); background:var(--surface-2); padding:3px 9px; border-radius:var(--rpill); display:inline-flex; align-items:center; gap:5px; }
.cchips { display:flex; flex-wrap:wrap; gap:4px 12px; }
.data td.nw { white-space:nowrap; }
.cchips a, .table-wrap .cchips a { display:inline-flex; align-items:center; gap:6px; color:var(--ink); text-decoration:none; font-family:var(--f-data); font-size:12.5px; }
.cchips a:hover { color:var(--accent); }
.cchips .swatch { width:9px; height:9px; border-radius:3px; flex:none; }
.task .facts .f { white-space:nowrap; }
.task .facts .f.why { white-space:normal; flex:1 1 100%; order:2; background:none; padding:0; border-radius:0; font-size:12.5px; line-height:1.45; }
.task .facts .f:has(> .pill) { background:none; padding:0; }
.task .facts .f b { color:var(--ink-2); font-weight:600; }
.task .facts .f .cd { width:11px; height:11px; border-radius:3px; }
.task .side { display:flex; flex-direction:column; align-items:flex-end; gap:9px; }
.task .side .dur { font-family:var(--f-data); font-size:12.5px; color:var(--ink-2); }
.task .side .acts { display:flex; gap:5px; }
.task.useradd { border-style:solid; }
.task.useradd .tc::after { content:"yours"; font-family:var(--f-data); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); background:var(--accent-wash); padding:1px 6px; border-radius:5px; }

/* ============================================================
   11 · CHARTS (timeline, workload, projector, coverage strip)
   ============================================================ */
.tl { overflow-x:auto; overflow-y:hidden; max-width:100%; }
.tl-inner { min-width:560px; }
.tl svg { display:block; width:100%; height:auto; }

.lrow { display:grid; grid-template-columns:130px minmax(0,1fr) 108px; gap:14px; align-items:center; }
@media (max-width:560px){ .lrow { grid-template-columns:92px minmax(0,1fr) 78px; gap:9px; } }
.lname { font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; min-width:0; }
.lname .swatch { width:10px; height:10px; border-radius:3px; flex:none; }
.lname .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track { position:relative; height:22px; background:var(--surface-2); border-radius:var(--r1); overflow:hidden; }
.track .fill { position:absolute; inset:0 auto 0 0; border-radius:var(--r1); }
.track .target { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); border-radius:1px; z-index:2; }
.lnum { font-family:var(--f-data); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-2); white-space:nowrap; }
.lnum b { color:var(--ink); font-weight:600; }
.stackcol { display:flex; flex-direction:column; gap:15px; }

.capbar { display:flex; align-items:stretch; height:56px; border-radius:var(--r2); overflow:hidden; border:1px solid var(--rule-soft); }
.capbar .seg { display:flex; flex-direction:column; justify-content:center; padding:0 15px; min-width:0; }
.capbar .seg .cv { font-family:var(--f-data); font-size:17px; font-weight:500; }
.capbar .seg .ck { font-size:11px; color:var(--ink-3); }

.strip { display:flex; gap:3px; flex-wrap:wrap; }
.cell { width:18px; height:18px; border-radius:4px; border:1px solid transparent; }
.cell.empty { background:transparent; border:1px dashed var(--c0-line); }
.cell.unprocessed { background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 3px,var(--rule) 3px,var(--rule) 4px); }
.key { display:flex; flex-wrap:wrap; gap:7px 15px; }
.key span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3); }
.key i.cell { width:13px; height:13px; }

/* projector */
.readout { display:flex; gap:26px; flex-wrap:wrap; }
.ro .v { font-family:var(--f-data); font-size:24px; font-weight:500; display:block; line-height:1.1; font-variant-numeric:tabular-nums; }
.ro .k { font-size:11.5px; color:var(--ink-2); }
.pstack { height:30px; display:flex; border-radius:var(--r1); overflow:hidden; background:var(--surface-2); margin:12px 0; }
.pstack .seg { height:100%; }
.pstack .seg + .seg { box-shadow:-2px 0 0 var(--surface); }
.stack-key { display:flex; gap:15px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); }
.stack-key span { display:inline-flex; align-items:center; gap:6px; }
.swatch { width:11px; height:11px; border-radius:3px; flex:none; display:inline-block; }
label.slider-label { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--ink-2); margin:16px 0 6px; }
label.slider-label b { font-family:var(--f-data); color:var(--ink); font-variant-numeric:tabular-nums; }
input[type=range] { width:100%; accent-color:var(--accent); height:22px; }
.verdict { margin-top:11px; padding:12px 14px; border-radius:var(--r1); background:var(--surface-2); font-size:13.5px; color:var(--ink-2); border-left:3px solid var(--rule-strong); }
.verdict b { color:var(--ink); }
.verdict.is-risk { border-left-color:var(--critical); background:var(--critical-wash); }
.verdict.is-ok { border-left-color:var(--good); background:var(--good-wash); }

/* ============================================================
   12 · TABLES
   ============================================================ */
.table-wrap { overflow-x:auto; }
table.data { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
table.data th, table.data td { text-align:right; padding:10px 12px; border-bottom:1px solid var(--rule-soft); }
table.data th:first-child, table.data td:first-child { text-align:left; }
table.data tbody tr:last-child td { border-bottom:0; }
table.data th { font-family:var(--f-data); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); font-weight:500; white-space:nowrap; }
table.data td.muted { color:var(--ink-3); }
table.data th.l, table.data td.l { text-align:left; }
table.data tbody tr:hover { background:var(--surface-2); }
table.data a { color:var(--accent); text-decoration:none; font-weight:600; }
table.data a:hover { text-decoration:underline; }
.conf-dot { display:inline-block; width:13px; height:13px; border-radius:3px; vertical-align:-2px; margin-right:6px; }

/* generic lists / panels */
.panels { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); }
.panels > div { padding:16px 18px; border-right:1px solid var(--rule-soft); border-top:1px solid var(--rule-soft); }
.panels > div:last-child { border-right:0; }
.panels h4 { font-family:var(--f-data); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-3); margin:0 0 10px; font-weight:500; }
.panels ul { margin:0; padding-left:16px; font-size:13px; color:var(--ink-2); }
.panels li { margin-bottom:7px; }
.panels li b { color:var(--ink); }
.none { font-size:13px; color:var(--ink-3); font-style:italic; margin:0; }

.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; }
.page-head h2 { font-family:var(--f-display); font-weight:600; font-size:27px; margin:0 0 4px; letter-spacing:-.015em; line-height:1.1; text-wrap:balance; }
.page-head .lede { color:var(--ink-2); font-size:14px; margin:0; max-width:64ch; }
.page-head .right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

/* ============================================================
   13 · STUDY SESSION overlay + floating pill
   ============================================================ */
.session-scrim { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); display:grid; place-items:center; padding:20px; opacity:0; animation:fade .2s ease forwards; }
@keyframes fade { to { opacity:1; } }
.session { width:min(560px,100%); background:var(--surface); border:1px solid var(--rule); border-radius:var(--r3); box-shadow:var(--sh-3); overflow:hidden; transform:translateY(8px) scale(.99); animation:pop .22s cubic-bezier(.34,1.3,.5,1) forwards; }
@keyframes pop { to { transform:none; } }
.session .s-top { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--rule-soft); }
.session .s-top .c { display:flex; align-items:center; gap:9px; font-family:var(--f-data); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); }
.session .s-top .c .swatch { width:11px; height:11px; border-radius:3px; }
.session .s-body { padding:26px 26px 22px; text-align:center; }
.session .s-task { font-family:var(--f-display); font-weight:600; font-size:22px; line-height:1.25; margin:0 0 20px; letter-spacing:-.01em; }
.session .s-timer { font-family:var(--f-data); font-size:58px; font-weight:500; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.session .s-timer.over { color:var(--serious); }
.session .s-sub { font-size:12px; color:var(--ink-3); margin-top:6px; }
.session .s-ring { margin:20px auto 4px; width:100%; height:8px; border-radius:var(--rpill); background:var(--surface-2); overflow:hidden; }
.session .s-ring > i { display:block; height:100%; background:var(--accent); border-radius:var(--rpill); transition:width 1s linear; }
.session .s-controls { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
.modeset { display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin-top:10px; }
.modeset button { height:36px; padding:0 12px; border-radius:var(--r1); border:1.5px solid var(--rule-strong); background:var(--surface); font-family:var(--f-ui); font-size:13px; font-weight:500; color:var(--ink-2); cursor:pointer; transition:all .14s; }
.modeset button:hover { border-color:var(--accent); color:var(--ink); }
.modeset button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.session .s-err { margin-top:14px; font-size:13px; color:var(--critical); text-align:center; }
.session .s-note { font-size:11.5px; color:var(--ink-3); margin-top:14px; text-align:center; }

.float-pill { position:fixed; right:22px; bottom:22px; z-index:60; display:flex; align-items:center; gap:11px; padding:10px 14px 10px 12px; background:var(--surface); border:1px solid var(--rule); border-radius:var(--rpill); box-shadow:var(--sh-3); cursor:pointer; }
.float-pill .pr { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:var(--accent-ink); flex:none; }
.float-pill .pr svg { width:16px; height:16px; }
.float-pill .txt { min-width:0; }
.float-pill .txt .a { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
.float-pill .txt .b { font-family:var(--f-data); font-size:12px; color:var(--ink-2); }

/* ============================================================
   14 · TOP HEADER content
   ============================================================ */
.greet { min-width:0; }
.greet h2 { font-family:var(--f-display); font-weight:600; font-size:24px; margin:0; letter-spacing:-.01em; line-height:1.15; }
.greet .meta { font-size:13px; color:var(--ink-2); margin-top:3px; }
.greet .meta b { color:var(--ink); font-weight:600; }
.head-right { display:flex; align-items:center; gap:14px; }
.semprog { text-align:right; min-width:150px; }
.semprog .eyebrow { display:block; margin-bottom:5px; }
.semprog .bar { height:6px; border-radius:var(--rpill); background:var(--surface-2); overflow:hidden; }
.semprog .bar > i { display:block; height:100%; background:var(--accent); border-radius:var(--rpill); }
.semprog .cap { font-family:var(--f-data); font-size:11px; color:var(--ink-3); margin-top:5px; display:block; }
.searchbox { position:relative; }
.searchbox input { width:180px; }
.searchbox svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-3); pointer-events:none; }
.searchbox input { padding-left:32px; }


/* collapsible rail (D-207): 68px icons; the mouse entering widens it over the page */
.rail { width:256px; overflow-x:hidden; z-index:40; transition:width .22s ease, box-shadow .22s ease, padding .22s ease; background:var(--bg); }
.rail-top { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:40px; }
.rail-top .brand { flex:1; min-width:0; overflow:hidden; }
.rail-top .brand { padding:0; }
.rail-top .brand h1 { font-size:14.5px; }
.brand-text { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail-toggle { width:32px; height:32px; flex:none; border-radius:var(--r1); border:1px solid var(--rule); background:none; color:var(--ink-3); cursor:pointer; display:grid; place-items:center; transition:background .14s ease, color .14s ease; }
.rail-toggle:hover { background:var(--surface-2); color:var(--ink); }
.rail-toggle svg { width:16px; height:16px; transition:transform .22s ease; }
.app.collapsed { grid-template-columns:68px minmax(0,1fr); }
.app.collapsed .rail { width:68px; padding-left:12px; padding-right:12px; }
.app.collapsed.peek .rail { width:256px; padding-left:16px; padding-right:16px; box-shadow:14px 0 40px -18px rgba(0,0,0,.45); background:var(--surface); }
.app.collapsed .rail-toggle svg { transform:rotate(180deg); }
.app.collapsed:not(.peek) .rail-top { flex-direction:column; gap:10px; }
.app.collapsed:not(.peek) .brand { padding:0; }
.app.collapsed:not(.peek) :is(.brand-text, .nav-title, .n-label, .n-badge, a.cnav .code, a.cnav .ct, .rail-foot) { display:none; }
.app.collapsed:not(.peek) :is(a.nav, a.cnav) { justify-content:center; padding-left:0; padding-right:0; }
.app.collapsed:not(.peek) a.nav[aria-current="page"]::before { left:-12px; }
a.nav .ic { transition:color .14s ease, transform .14s ease; }
a.nav:hover .ic { color:var(--accent); transform:translateX(2px); }

/* ============================================================
   15 · MOBILE bottom nav + responsive
   ============================================================ */
.mobnav { display:none; }
.mobtop { display:none; }

@media (max-width:1080px) {
  .app { grid-template-columns:216px minmax(0,1fr); }
  .content { padding:0 20px 96px; }
  .split { grid-template-columns:1fr; }
  .focus-in { grid-template-columns:1fr; gap:18px; }

/* ============================================================
   SCHEDULE (D-207) - meetings from GET /state, placed by time
   ============================================================ */
.sk-controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; }
.sk-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--ink-3); }

.sk-block { position:absolute; border-radius:var(--r1); padding:7px 9px; overflow:hidden; border-left:4px solid var(--c);
  background:color-mix(in oklab, var(--c) 14%, var(--surface)); transition:transform .14s ease, box-shadow .14s ease; }

/* tablet: the rail takes its grid column's 216px; a later width:256px covered 40px of the content */

<body>
<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <div class="brand">
        <div class="mark" aria-hidden="true">S</div>
        <div class="brand-text"><h1>Semester Console</h1><div class="sub" id="brandSub">-</div></div>
      </div>
      <button class="rail-toggle" id="railToggle" type="button" aria-expanded="true" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
    </div>
    <nav class="rail-nav" id="nav" aria-label="Primary"></nav>
    <div class="rail-foot" id="railFoot">The study server is the source of truth.</div>
  </aside>

  <div class="content">
    <div class="mobtop">
      <div class="brand">
        <div class="mark" aria-hidden="true">S</div>
        <div><h1 style="font-size:16px">Semester Console</h1></div>
      </div>
      <button class="btn-icon btn-ghost" id="themeMob" aria-label="Toggle theme"></button>
    </div>
    <header class="topbar" id="topbar"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="mobnav" id="mobnav" aria-label="Sections"></nav>
<div id="tip" role="status" aria-live="polite"></div>
<div id="overlay"></div>
<div id="pillHost"></div>

<script>
/* ============================================================
   LOAD - this page holds no study data of its own. GET /state is
   the whole truth (D-19, D-163): the server computes every metric
   and ranking, the browser derives cosmetics only (groupings,
   countdowns, colours). A field the server sends as null renders
   as unknown, never as 0; a panel the server has no data for yet
   says "not built yet" (D-186).
   ============================================================ */
const SERIES = ["--k1", "--k2", "--k3", "--k4", "--k5", "--k6", "--k7", "--k8"];
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const DAY = 86400000;
const d = s => new Date(s + "T00:00:00");
const pad2 = n => String(n).padStart(2, "0");
const localISO = () => { const n = new Date(); return `${n.getFullYear()}-${pad2(n.getMonth() + 1)}-${pad2(n.getDate())}`; };
const daysBetween = (a, b) => Math.round((d(b) - a) / DAY);
const fmtDate = iso => d(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const fmtLong = iso => d(iso).toLocaleDateString("en-GB", { day: "numeric", month: "long" });

let DATA = null, TODAY = null, SEM = null, STATE = null;

/* The server's blob, keyed the way this page reads it. Courses are keyed by code in the URL
   (D-163 point 4: the code is for display and for URLs); courseId joins them to the plan. */
function adapt(s) {
  const courses = s.courses.map((c, i) => ({
    id: c.code, courseId: c.course_id, code: c.code, name: c.name,
    instructor: c.instructor, credits: c.credits, targetGrade: c.target_grade,
    strategy: c.strategy, conceded: c.conceded, hoursLogged: c.minutes_logged / 60,
    colorVar: SERIES[i % SERIES.length],
    assessments: s.assessment_slots.filter(a => a.course_id === c.course_id).map(a => ({
      name: a.name, kind: a.kind, sessionType: a.session_type, weight: a.weight,
      date: a.date, approx: a.date_approx, time: a.time, room: a.room, mark: a.mark
    }))
  }));
  return {
    generatedAt: s.generated_at,
    semester: { name: s.semester.name, start: s.semester.start, end: s.semester.end, endApprox: s.semester.end_approx, today: localISO() },
    weeklyCapacity: s.capacity.declared_hours_per_week,
    capacitySuggestion: s.capacity.suggested_from_timetable,
    capacitySuggestionId: s.capacity.suggestion_id,
    courses,
    plan: s.plan.current,
    /* null = no timetable entered (unknown), not an empty week */
    meetings: s.timetable && Array.isArray(s.timetable.meetings) && s.timetable.meetings.length ? s.timetable.meetings : null
  };
}

/* Cosmetic and scratch arithmetic only. The grade numbers feed the projector, which is labelled
   scratch (D-19); nothing here ranks or scores anything. */
function derive() {
  DATA.courses.forEach(c => {
    c.color = cssVar(c.colorVar);
    const graded   = c.assessments.filter(a => a.mark !== null);
    const ungraded = c.assessments.filter(a => a.mark === null);
    // One unknown weight makes every sum below unknown: it is not a 0.
    c.weightsKnown = c.assessments.every(a => a.weight != null);
    if (c.weightsKnown) {
      c.earned         = graded.reduce((t, a) => t + a.weight * a.mark / 100, 0);
      c.assessedWeight = graded.reduce((t, a) => t + a.weight, 0);
      c.openWeight     = 100 - c.assessedWeight;
      c.lost           = c.assessedWeight - c.earned;
      c.standing       = c.assessedWeight ? (c.earned / c.assessedWeight) * 100 : null;
      c.ceiling        = c.earned + c.openWeight;
    } else {
      c.earned = c.assessedWeight = c.openWeight = c.lost = c.standing = c.ceiling = null;
    }
    c.next = ungraded.filter(a => a.date && d(a.date) >= TODAY).sort((a, b) => d(a.date) - d(b.date))[0] || null;
    c.daysToNext = c.next ? daysBetween(TODAY, c.next.date) : null;
  });
  const start = DATA.semester.start, end = DATA.semester.end, today = DATA.semester.today;
  SEM = {
    week: start ? Math.floor(daysBetween(d(start), today) / 7) + 1 : null,
    weeks: start && end ? Math.ceil(daysBetween(d(start), end) / 7) : null,
    daysLeft: end ? daysBetween(TODAY, end) : null,
    pct: (start && end) ? Math.max(0, Math.min(100, Math.round(daysBetween(d(start), today) / daysBetween(d(start), end) * 100))) : null
  };
}

const wTxt  = w => (w == null ? "weight TBD" : w + "%");
const num = (v, digits) => v == null ? '<span class="unknown">-</span>' : v.toFixed(digits);
const pct = v => v == null ? '<span class="unknown">-</span>' : v + "%";
const wCell = w => (w == null ? '<span class="muted">TBD</span>' : w + "%");
const fmtWhen = a => a.date ? (a.approx ? "~" + fmtDate(a.date) : fmtDate(a.date)) : "TBD";
const whenLong = a => a.date ? (a.approx ? "~" : "") + fmtLong(a.date) : "TBD";

/* ============================================================
   THE PLAN - read from the server as it is stored (D-163). The
   lanes arrive ranked; this page lists them in lane order and
   never re-sorts or re-scores.
   ============================================================ */
const LANES = ["review", "study", "setup"];
const LANE_LABEL = { review: "Review", study: "Study", setup: "Setup", custom: "Task" };
const LANE_TITLE = { review: "Reviews", study: "Study", setup: "Setup" };
const LANE_ICON = { review: "clock", study: "book", setup: "flag" };
const LANE_EMPTY = { review: "No reviews due.", study: "No study items in this plan.", setup: "No setup items in this plan." };
const CUSTOM_MINS = 30;

function toItem(lane, it) {
  return {
    uid: lane + ":" + (it.setup_key || it.topic_id),
    lane, rank: it.rank, course: DATA.courses.find(c => c.courseId === it.course_id) || null,
    what: lane === "setup" ? it.reason : it.topic_name, why: it.reason,
    topicId: it.topic_id || null, setupKey: it.setup_key || null,
    mins: it.estimated_minutes ?? null,
    marks: it.marks_unlocked_estimate ?? null, marksTier: it.marks_unlocked_estimate_tier
  };
}
/* the study lane: the server's entries, one per chapter (D-238) or per topic with no chapter
   (D-244). A plan stored before D-240 has no chapter at all, so its topics carry no label. */
function entryItem(e, l) {
  const anyChapter = l.entries.some(x => x.material_id);
  const alone = anyChapter ? `${e.topics[0]} (not taught yet)` : e.topics[0];
  return {
    uid: "study:" + (e.material_id || e.topic_ids[0]),
    lane: "study", rank: e.rank, course: DATA.courses.find(c => c.courseId === e.course_id) || null,
    what: e.material_id ? `${e.chapter}: ${e.topics.join(", ")}` : alone,
    why: l.items.filter(it => e.topic_ids.includes(it.topic_id)).map(it => it.reason).join(" | "),
    topicId: e.material_id ? null : e.topic_ids[0], setupKey: null, materialId: e.material_id,
    mins: e.estimated_minutes, marks: null
  };
}
function laneEntries(lane) {
  const l = DATA.plan.lanes[lane];
  if (lane === "study") return l.entries.map(e => entryItem(e, l));
  return l.items.map(it => toItem(lane, it));
}
function planItems() {
  if (!DATA.plan) return [];
  return LANES.flatMap(laneEntries);
}
const laneItems = lane => planItems().filter(i => i.lane === lane);
function laneCount(lane) {
  const l = DATA.plan.lanes[lane];
  const n = lane === "study" ? l.entries.filter(e => e.material_id).length : 0;
  const chapters = n ? `${n} chapter${n === 1 ? "" : "s"} · ` : "";
  return `${chapters}${l.items.length} ${chapters ? "topics " : ""}shown${l.hidden ? ` · ${l.hidden} held back` : ""}`;
}
function planAge() {
  if (!DATA.plan) return null;
  const m = new Date(DATA.plan.created_at), m0 = new Date(m.getFullYear(), m.getMonth(), m.getDate());
  const n = Math.round((TODAY - m0) / DAY);
  return { when: m.toLocaleDateString("en-GB", { day: "numeric", month: "short" }), days: n };
}
function planAgeLabel() {
  const a = planAge();
  if (!a) return "no plan yet";
  return a.days <= 0 ? "plan made today" : `plan made ${a.when} · ${a.days} day${a.days === 1 ? "" : "s"} old`;
}
function minsTxt(it) {
  if (it.custom) return it.mins + "m";
  if (it.lane === "setup") return it.marks == null ? "marks unknown" : `unlocks ${it.marksTier === "inferred" ? "~" : ""}${Math.round(it.marks)} marks`;
  return it.mins == null ? "time unknown" : it.mins + "m";
}

/* ============================================================
   STATE - this browser's own scratch (in-memory + safe
   localStorage): today's completions, personal tasks, the theme.
   NOT study data. Nothing here reaches the server.
   ============================================================ */
const STORE_KEY = "semcon.state.v2";
const safeGet = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch { return {}; } };
const safeSet = o => { try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch {} };

function initState() {
  const raw = safeGet();
  const today = DATA.semester.today;
  STATE = {
    day: today,
    items: (raw.day === today ? (raw.items || {}) : {}),   // per-day completion of plan items
    custom: Array.isArray(raw.custom) ? raw.custom : [],   // personal tasks (persist across days until done)
    theme: raw.theme || "system"
  };
  STATE.custom = STATE.custom.filter(t => !(t.done && t.doneDay && t.doneDay !== today));
}
function persist() { safeSet(STATE); }

function newId() { return "u" + Math.random().toString(36).slice(2, 9); }

function customItems(includeDone) {
  return (STATE.custom || [])
    .filter(t => includeDone || !t.done)
    .map(t => ({
      uid: "custom:" + t.id, custom: true, id: t.id, lane: "custom",
      course: t.course ? DATA.courses.find(c => c.id === t.course) || null : null,
      mins: t.mins || CUSTOM_MINS, what: t.title, why: "added by you", done: !!t.done
    }));
}

function itemStatus(it) {
  if (it.custom) { const t = STATE.custom.find(x => x.id === it.id); return t && t.done ? "done" : "upcoming"; }
  const s = STATE.items[it.uid];
  return s && s.status ? s.status : "upcoming";
}
const isOpen = it => { const s = itemStatus(it); return s !== "done" && s !== "skipped"; };

/* what Today lists: your own tasks first, then the server's plan in its own order */
function todayList() { return customItems(false).concat(planItems().filter(i => itemStatus(i) !== "skipped")); }

/* ---- actions ---- */
function addCustom(title, course, mins) {
  title = (title || "").trim(); if (!title) return;
  STATE.custom.unshift({ id: newId(), title, course: course || null, mins: mins || CUSTOM_MINS, done: false, doneDay: null });
  persist(); refresh();
}
function toggleItem(uid) {
  if (uid.startsWith("custom:")) {
    const id = uid.slice(7); const t = STATE.custom.find(x => x.id === id); if (!t) return;
    t.done = !t.done; t.doneDay = t.done ? STATE.day : null;
  } else {
    const cur = STATE.items[uid];
    if (cur && cur.status === "done") delete STATE.items[uid];
    else STATE.items[uid] = { status: "done" };
  }
  persist(); refresh();
}
function skipItem(uid) {
  if (uid.startsWith("custom:")) { const id = uid.slice(7); const t = STATE.custom.find(x => x.id === id); if (t) { t.done = true; t.doneDay = STATE.day; } }
  else STATE.items[uid] = { status: "skipped" };
  persist(); refresh();
}
function deleteCustom(id) { STATE.custom = STATE.custom.filter(x => x.id !== id); persist(); refresh(); }
function clearDoneCustom() { STATE.custom = STATE.custom.filter(t => !t.done); persist(); refresh(); }

/* ============================================================
   STUDY SESSION controller (3.5; D-198, D-199, D-202). Start
   picks a mode and opens a session on the server; the page
   counts the minutes, pauses left out, and Complete posts that
   count to POST /sessions/stop, which caps it at the server's
   clock. A personal task has no course, so it posts nothing.
   ============================================================ */
const MODES = [["practice", "Practice"], ["explain-chapter", "Explain chapter"], ["review-quiz", "Review quiz"],
               ["exam-walkthrough", "Exam walkthrough"], ["mock", "Mock"]];
const LANE_MODE = { review: "review-quiz", study: "practice", setup: null };   // a setup item selects none (D-199)
let SESSION = null;   // {uid,item,mode,id,plannedSec,elapsed,paused,tick,busy,error}

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body) });
  const answer = await response.json();
  if (!response.ok) throw answer;
  return answer;
}
const errorText = err => err && err.code ? `${err.message}. Fix: ${err.fix}.` : "The study server did not answer: " + (err && err.message);

function findItem(uid) {
  if (uid.startsWith("custom:")) return customItems(true).find(i => i.uid === uid);
  return planItems().find(i => i.uid === uid);
}
const running = () => !!SESSION && (!!SESSION.item.custom || SESSION.id !== null);
function startSession(uid) {
  const item = findItem(uid); if (!item) return;
  if (SESSION && SESSION.tick) clearInterval(SESSION.tick);   // one left open on the server expires unrecorded (D-17)
  SESSION = { uid, item, mode: item.custom ? null : LANE_MODE[item.lane], id: null,
              plannedSec: item.mins ? item.mins * 60 : null, elapsed: 0, paused: false, busy: false, error: null };
  if (item.custom) SESSION.tick = setInterval(tickSession, 1000);
  renderSession();
  refresh();
}
async function beginSession() {
  const s = SESSION;
  if (!s || s.busy || !s.mode || running()) return;
  const body = { code: s.item.course.code, mode: s.mode };
  if (s.item.materialId) Object.assign(body, { subject_type: "material", subject_id: s.item.materialId });
  else if (s.item.topicId) Object.assign(body, { subject_type: "topic", subject_id: s.item.topicId });
  s.busy = true; s.error = null; renderSession();
  try { s.id = (await post("/sessions", body)).session_id; s.tick = setInterval(tickSession, 1000); }
  catch (err) { s.error = errorText(err); }
  s.busy = false;
  if (SESSION === s) renderSession();
}
function tickSession() {
  if (!running() || SESSION.paused) return;
  SESSION.elapsed++;
  updateSessionTime();
}
function togglePause() { if (!running()) return; SESSION.paused = !SESSION.paused; renderSession(); }
async function closeSession(complete) {
  const s = SESSION;
  if (!s || s.busy) return;
  const uid = s.uid, spent = Math.round(s.elapsed / 60);
  if (complete && s.id) {
    const body = { code: s.item.course.code, session_id: s.id, minutes: spent };
    if (s.item.setupKey) body.setup_key = s.item.setupKey;
    s.busy = true; s.error = null; renderSession();
    try { await post("/sessions/stop", body); }
    catch (err) { s.busy = false; s.error = errorText(err); if (SESSION === s) renderSession(); return; }
  }
  if (s.tick) clearInterval(s.tick);
  if (complete) {
    if (uid.startsWith("custom:")) { const id = uid.slice(7); const t = STATE.custom.find(x => x.id === id); if (t) { t.done = true; t.doneDay = STATE.day; } }
    else STATE.items[uid] = { status: "done" };
    persist();
  }
  if (SESSION !== s) return;
  SESSION = null;
  $("#overlay").innerHTML = "";
  renderPill();
  refresh();
}
function hideSession() {   // minimise, keep running; before the timer starts, cancel
  if (!running()) { closeSession(false); return; }
  $("#overlay").innerHTML = "";
  renderPill();
}
function setMode(mode) { if (SESSION && !running()) { SESSION.mode = mode; renderSession(); } }

function sessionTimeStr() {
  const clock = s => `${pad2(Math.floor(s / 60))}:${pad2(s % 60)}`;
  if (SESSION.plannedSec == null) return { str: clock(SESSION.elapsed), over: false, pct: 0, sub: "elapsed · this item has no planned time" };
  const remain = SESSION.plannedSec - SESSION.elapsed;
  const over = remain < 0;
  return { str: clock(Math.abs(remain)), over, pct: Math.min(100, SESSION.elapsed / SESSION.plannedSec * 100),
    sub: over ? "over your planned time" : "remaining of " + SESSION.item.mins + " min" };
}
function updateSessionTime() {
  const t = sessionTimeStr(), el = $("#sTimer"), bar = $("#sBar"), pill = $("#pillTime");
  if (el) { el.textContent = t.str; el.classList.toggle("over", t.over); const sub = $("#sSub"); if (sub) sub.textContent = t.sub; }
  if (bar) bar.style.width = t.pct + "%";
  if (pill) pill.textContent = t.str;
}
function sessionBody() {
  const busy = SESSION.busy ? " disabled" : "";
  if (!running()) return `
        <span class="eyebrow">What kind of session?</span>
        <div class="modeset" role="group" aria-label="Session mode">
          ${MODES.map(([m, label]) => `<button data-mode="${m}" aria-pressed="${SESSION.mode === m}">${label}</button>`).join("")}
        </div>
        <div class="s-controls">
          <button class="btn btn-primary" data-sx="begin"${SESSION.mode ? busy : " disabled"}>${ICON.play}Start the timer</button>
        </div>
        <div class="s-note">The timer counts what you study, pauses left out. A session left open past 4 hours records nothing.</div>`;
  const t = sessionTimeStr();
  return `
        <div class="s-timer${t.over ? " over" : ""}" id="sTimer">${t.str}</div>
        <div class="s-sub" id="sSub">${esc(t.sub)}</div>
        <div class="s-ring"><i id="sBar" style="width:${t.pct}%"></i></div>
        <div class="s-controls">
          <button class="btn ${SESSION.paused ? "btn-primary" : "btn-secondary"}" data-sx="pause"${busy}>${SESSION.paused ? ICON.play + "Resume" : ICON.pause + "Pause"}</button>
          <button class="btn btn-secondary" data-sx="skip"${busy}>${ICON.skip}Skip</button>
          <button class="btn ${SESSION.paused ? "btn-secondary" : "btn-primary"}" data-sx="done"${busy}>${ICON.check}Complete</button>
        </div>
        <div class="s-note">${SESSION.item.custom
          ? "A personal task stays on this page."
          : "Complete logs these minutes. Past 4 hours the session records nothing: log the real minutes with the study tools."}</div>`;
}
function renderSession() {
  if (!SESSION) return;
  const it = SESSION.item, c = it.course;
  const cSwatch = c ? `<span class="swatch" style="background:${c.color}"></span>` : "";
  const cName = c ? esc(c.name) : "Personal task";
  $("#overlay").innerHTML = `
  <div class="session-scrim" id="scrim">
    <div class="session" role="dialog" aria-modal="true" aria-label="Study session">
      <div class="s-top">
        <span class="c">${cSwatch}${esc((c && c.code) || "task")}</span>
        <button class="btn-icon btn-ghost" data-sx="min" aria-label="${running() ? "Minimise session" : "Cancel"}">${ICON.x}</button>
      </div>
      <div class="s-body">
        <div class="eyebrow" style="margin-bottom:6px;color:var(--accent)">${cName}</div>
        <h2 class="s-task">${esc(it.what)}</h2>${sessionBody()}
        ${SESSION.error ? `<div class="s-err" role="alert">${esc(SESSION.error)}</div>` : ""}
      </div>
    </div>
  </div>`;
  const scrim = $("#scrim");
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) hideSession(); });
  $("#pillHost").innerHTML = "";
}
function renderPill() {
  if (!running()) { $("#pillHost").innerHTML = ""; return; }
  const t = sessionTimeStr();
  $("#pillHost").innerHTML = `
    <div class="float-pill" id="floatPill" role="button" tabindex="0" aria-label="Resume study session">
      <span class="pr">${ICON.play}</span>
      <span class="txt"><span class="a">${esc(SESSION.item.what)}</span><span class="b" id="pillTime">${t.str}</span></span>
    </div>`;
  const p = $("#floatPill");
  p.addEventListener("click", renderSession);
  p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); renderSession(); } });
}

const lanePill = it => `<span class="pill ${it.custom ? "plain" : "lane lane-" + it.lane}"><span class="dot"></span>${LANE_LABEL[it.lane]}</span>`;
function examFactHTML(it) {
  const c = it.course;
  if (!c || !c.next) return `<span class="f">${ICON.clock}No dated exam</span>`;
  return `<span class="f">${ICON.clock}Exam · <b>${c.next.approx ? "~" : ""}${c.daysToNext}d</b></span>`;
}

/* focus = the first open item of the server's plan, in lane order */
function focusItem() { return planItems().find(isOpen) || null; }

function focusHero() {

function timelineSVG(courses) {
  const W = 1000, H = 132, padL = 26, padR = 64;
  /* semester dates not set: run from the start (or today) to the last dated assessment */
  const lastDate = courses.flatMap(c => c.assessments.filter(a => a.date).map(a => a.date)).sort().pop();
  const t0 = d(DATA.semester.start || DATA.semester.today), t1 = d(DATA.semester.end || lastDate || DATA.semester.today), span = (t1 - t0) || 1;
  const x = iso => padL + ((d(iso) - t0) / span) * (W - padL - padR);
  const clampX = v => Math.max(padL + 12, Math.min(W - padR - 12, v));
  const axisY = 96;
  const marks = [];
  courses.forEach(c => c.assessments.filter(a => a.date).forEach(a => {
    marks.push({ x: x(a.date), h: a.weight == null ? 22 : 8 + (a.weight / 100) * 52, c, a, past: d(a.date) < TODAY });
  }));
  marks.sort((m, n) => m.x - n.x);
  /* courses sitting on the same date stand side by side, not on top of each other */
  marks.forEach((m, i) => {
    const same = marks.filter(o => o.a.date === m.a.date);
    m.n = same.length; m.dx = (same.indexOf(m) - (same.length - 1) / 2) * 11; m.first = same[0] === m;
  });
  if (!marks.length) return `<p class="none">No assessment has a date yet.</p>`;
  let ticks = "";
  for (let t = new Date(t0); t <= t1; t = new Date(+t + 7 * DAY)) {
    const iso = `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
    ticks += `<line x1="${x(iso)}" y1="${axisY - 4}" x2="${x(iso)}" y2="${axisY + 4}" stroke="var(--rule)" stroke-width="1"/>`;
  }
  let lastLabelX = -999;
  const bars = marks.map(m => {
    const showLabel = m.x - lastLabelX > 52; if (showLabel) lastLabelX = m.x;
    const tip = `${esc(m.c.code)} - ${esc(m.a.name)}&#10;${wTxt(m.a.weight)} · ${whenLong(m.a)}` + (m.a.mark !== null ? `&#10;scored ${m.a.mark}` : "&#10;not sat yet");
    return `<g data-tip="${tip}">
      <rect x="${m.x + m.dx - 4}" y="${axisY - m.h}" width="8" height="${m.h}" rx="3" fill="${m.c.color}" opacity="${m.past ? 0.34 : m.a.weight == null ? 0.5 : 1}"/>
      ${m.a.weight == null ? `<text x="${clampX(m.x)}" y="${axisY - m.h - 6}" text-anchor="middle" font-size="10.5" font-family="var(--f-data)" fill="var(--ink-3)">?</text>` : ""}
      ${m.a.mark !== null ? `<text x="${clampX(m.x)}" y="${axisY - m.h - 6}" text-anchor="middle" font-size="10.5" font-family="var(--f-data)" fill="var(--ink-2)">${m.a.mark}</text>` : ""}
      ${showLabel ? `<text x="${clampX(m.x)}" y="${axisY + 17}" text-anchor="middle" font-size="10" font-family="var(--f-data)" fill="var(--ink-3)">${m.n > 1 ? m.n + " courses" : esc(m.c.code.split(" ")[0])}</text>
        <text x="${clampX(m.x)}" y="${axisY + 29}" text-anchor="middle" font-size="10" font-family="var(--f-data)" fill="var(--ink-3)">${fmtDate(m.a.date)}</text>` : ""}
    </g>`;
  }).join("");
  return `<div class="tl"><div class="tl-inner">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Assessment timeline; bar height is the weight of each assessment.">
      <line x1="${padL}" y1="${axisY}" x2="${W - padR}" y2="${axisY}" stroke="var(--rule)" stroke-width="1.5"/>
      ${ticks}
      <line x1="${x(DATA.semester.today)}" y1="14" x2="${x(DATA.semester.today)}" y2="${axisY + 6}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="${clampX(x(DATA.semester.today))}" y="10" text-anchor="middle" font-size="10" font-family="var(--f-data)" fill="var(--ink)">TODAY</text>
      ${bars}
    </svg></div></div>`;
}

function runProjector(box) {
  const c = DATA.courses.find(x => x.id === box.dataset.projector);
  const assume = +box.querySelector('[data-role="assume"]').value;
  const target = +box.querySelector('[data-role="target"]').value;
  box.querySelector('[data-out="assume"]').textContent = assume + "%";
  box.querySelector('[data-out="target"]').textContent = target + "%";
  const projected = c.earned + c.openWeight * assume / 100;
  const pv = box.querySelector('[data-out="project"]'); pv.className = "verdict";
  pv.innerHTML = c.openWeight === 0
    ? `Everything is graded. This course finishes at <b>${c.earned.toFixed(1)}</b>.`
    : `Average <b>${assume}%</b> on the remaining <b>${c.openWeight}%</b> and you finish at <b>${projected.toFixed(1)}</b>. ${c.next ? `Next up: ${esc(c.next.name)}, ${c.next.weight == null ? "share of the grade not set" : c.next.weight + "% of the grade"}, in ${c.daysToNext} days.` : ""}`;
  const needed = c.openWeight === 0 ? null : (target - c.earned) / c.openWeight * 100;
  const nv = box.querySelector('[data-out="need"]');
  if (needed === null) { nv.className = "verdict"; nv.innerHTML = `Nothing left to sit - the grade is settled.`; }
  else if (needed > 100) { nv.className = "verdict is-risk"; nv.innerHTML = `<b>${target}% is out of reach.</b> It would take ${needed.toFixed(0)}% on everything remaining, and the ceiling is ${c.ceiling.toFixed(0)}. Aim at ${Math.floor(c.ceiling)} and spend the hours where they still move something.`; }
  else if (needed <= 0) { nv.className = "verdict is-ok"; nv.innerHTML = `<b>Already secured.</b> Even scoring zero on what's left, this course finishes at or above ${target}%.`; }
  else { const strain = c.standing === null ? null : needed - c.standing; nv.className = "verdict" + (needed > 90 ? " is-risk" : ""); nv.innerHTML = `You need <b>${needed.toFixed(0)}%</b> across the remaining ${c.openWeight}%. ${strain === null ? `Nothing is graded yet, so there's no track record to say whether that's a stretch.` : strain > 8 ? `That's ${strain.toFixed(0)} points above your current ${Math.round(c.standing)} - real work, not a rounding error.` : `That's about where you're already running.`}`; }
}

/* the weekly class schedule, from GET /state timetable.meetings (D-207); none entered = unknown */
const SK = { kind: "all", day: null };
const SK_DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const SK_HPX = 68;
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const isoToday = () => ((TODAY.getDay() + 6) % 7) + 1;
const skCourse = m => DATA.courses.find(c => c.courseId === m.course_id) || null;
/* the kind says nothing while every class carries the same one */
const skKinds = () => new Set(DATA.meetings.map(m => m.kind)).size;
const skDays = () => (DATA.meetings.some(m => m.weekday >= 6) ? 7 : 5);
/* ISO week number: the week holding this week's Thursday, counted from the one holding Jan 4 */
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
const skParity = () => (isoWeek(TODAY) % 2 ? "odd" : "even");
/* an odd/even-week class that does not meet this week (D-216) */
const skOff = m => m.week_parity !== "every" && m.week_parity !== skParity();

/* side-by-side columns for meetings that overlap in one day */
function skLayout(list) {
  const sorted = [...list].sort((a, b) => toMin(a.start) - toMin(b.start) || toMin(a.end) - toMin(b.end));
  const out = []; let cluster = [], clusterEnd = -1;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.lane + 1)); cluster.forEach(x => { x.n = n; out.push(x); }); cluster = []; };
  sorted.forEach(m => {
    if (cluster.length && toMin(m.start) >= clusterEnd) { flush(); clusterEnd = -1; }
    const used = cluster.filter(x => toMin(x.m.end) > toMin(m.start)).map(x => x.lane);
    let lane = 0; while (used.includes(lane)) lane++;
    cluster.push({ m, lane }); clusterEnd = Math.max(clusterEnd, toMin(m.end));
  });
  flush();
  return out;
}

/* narrow = it shares its time with another class, so it gets half the column or less */
function skBlock(m, style, narrow = false) {
  const c = skCourse(m);
  const color = c ? c.color : "var(--ink-3)";
  const off = skOff(m);
  const parity = m.week_parity !== "every" ? m.week_parity + " weeks" : "";
  const when = `${m.start}–${m.end}${m.room ? " · " + m.room : ""}`;
  const tip = (off ? "Not this week: " : "") + [m.code, m.kind, m.group_label, parity, c ? c.name : "", when].filter(Boolean).join(" · ");
  return `<div class="sk-block${off ? " off" : ""}${narrow ? " narrow" : ""}" style="--c:${color};${style || ""}" title="${esc(tip)}">
    <div class="code">${esc(m.code)}${skKinds() > 1 ? `<span class="sk-chip kind">${esc(m.kind)}</span>` : ""}${m.group_label ? `<span class="sk-chip">${esc(m.group_label)}</span>` : ""}${m.week_parity !== "every" ? `<span class="sk-chip" title="ISO week number">${esc(m.week_parity)} weeks</span>` : ""}${m.tier === "inferred" ? '<span class="sk-chip inf" title="read from an image, not confirmed">unconfirmed</span>' : ""}</div>
    <div class="nm">${esc(c ? c.name : m.code)}</div>
    ${c && c.instructor ? `<div class="meta who">${esc(c.instructor)}</div>` : ""}
    <div class="meta">${esc(when)}</div></div>`;
}

function skBody() {
  const ms = DATA.meetings.filter(m => SK.kind === "all" || m.kind === SK.kind);
  const days = skDays();
  const first = Math.min(...DATA.meetings.map(m => toMin(m.start))), last = Math.max(...DATA.meetings.map(m => toMin(m.end)));
  const start = Math.floor(first / 60) * 60, hrs = Math.max(4, Math.ceil(last / 60) - start / 60);
  const today = isoToday(), now = new Date(), cur = now.getHours() * 60 + now.getMinutes();
  let grid = `<div></div>` + SK_DAYS.slice(0, days).map((n, i) => `<div class="sk-dh ${i + 1 === today ? "today" : ""}">${n}${i + 1 === today ? "<small>today</small>" : ""}</div>`).join("");
  grid += `<div class="sk-hours">${Array.from({ length: hrs + 1 }, (_, i) => `<span style="top:${i * SK_HPX}px">${pad2(start / 60 + i)}:00</span>`).join("")}</div>`;
  for (let wd = 1; wd <= days; wd++) {
    const blocks = skLayout(ms.filter(m => m.weekday === wd)).map(x => {
      const w = 100 / x.n;
      return skBlock(x.m, `top:${(toMin(x.m.start) - start) / 60 * SK_HPX}px;height:${(toMin(x.m.end) - toMin(x.m.start)) / 60 * SK_HPX - 3}px;left:calc(${x.lane * w}% + 3px);width:calc(${w}% - 6px)`, x.n > 1);
    }).join("");
    const nowLine = wd === today && cur >= start && cur <= start + hrs * 60 ? `<div class="sk-now" style="top:${(cur - start) / 60 * SK_HPX}px"></div>` : "";
    grid += `<div class="sk-col ${wd === today ? "today" : ""}">${blocks}${nowLine}</div>`;
  }
  if (SK.day == null || SK.day > days) SK.day = today <= days ? today : 1;
  const dayRows = ms.filter(m => m.weekday === SK.day).sort((a, b) => toMin(a.start) - toMin(b.start))
    .map(m => `<div class="sk-row"><div class="t"><b>${esc(m.start)}</b>${esc(m.end)}</div>${skBlock(m)}</div>`).join("");
  const seen = [...new Set(DATA.meetings.map(m => m.course_id))].map(id => DATA.courses.find(c => c.courseId === id)).filter(Boolean);
  return `<div class="sk-legend">${seen.map(c => `<span style="--c:${c.color}"><i></i>${esc(c.code)} · ${esc(c.name)}</span>`).join("")}${DATA.meetings.some(m => m.tier === "inferred") ? '<small class="sk-note">Dashed edge: read from an image, not confirmed yet.</small>' : ""}</div>
    <section class="sk-week" style="--days:${days};--hpx:${SK_HPX}px;--hrs:${hrs}" aria-label="Weekly schedule">${grid}</section>
    <section class="sk-dayview" aria-label="Daily schedule">
      <div class="sk-tabs" role="tablist" id="skTabs">${SK_DAYS.slice(0, days).map((n, i) => `<button type="button" role="tab" data-day="${i + 1}" aria-selected="${i + 1 === SK.day}">${n.slice(0, 3)}</button>`).join("")}</div>
      <div class="sk-list">${dayRows || '<p class="none">No classes this day.</p>'}</div></section>`;
}

/* one row per sitting (date, name, weight), the courses that sit it as chips - not one row per course */
function sittings(list) {
  const groups = [];
  list.forEach(({ c, a }) => {
    const key = [a.date, a.name, a.weight, a.approx, a.time, a.room, a.sessionType, a.kind].join("|");
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, a, courses: [], marks: [] });
    g.courses.push(c); g.marks.push(a.mark);
  });
  return groups;
}
const courseChips = cs => `<span class="cchips">${cs.map(c => `<a href="${courseHref(c)}"><span class="swatch" style="background:${c.color}"></span>${esc(c.code)}</a>`).join("")}</span>`;
/* the plan ranks exams only; a project or a lab is on the calendar but never in the plan (D-15, D-20) */
const sittingName = a => esc(a.name) + (a.kind === "exam" ? "" : ` <span class="pill flag" data-unplanned>${esc(a.kind)} · not planned</span>`);
const tbd = v => (v == null ? '<span class="muted">TBD</span>' : esc(v));
/* the walk script reads each row's courses and date from these */
const sittingData = g => `data-codes="${esc(g.courses.map(c => c.code).join("|"))}" data-date="${esc(g.a.date || "")}"`;

};
