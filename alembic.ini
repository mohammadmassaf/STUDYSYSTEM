# Dev-only: lets `uv run alembic revision --autogenerate -m "..."` find the scripts.
# The runtime never reads this file; `study migrate` builds its config in code.
# The database URL is not here on purpose: env.py derives it from the data dir.
[alembic]
script_location = src/studysystem/db/migrations
file_template = %%(rev)s_%%(slug)s
